<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classes Manager - ExamPrepHub Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1e1b4b, #312e81); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 20px; color: #fbbf24; }
  .header nav a { color: #e2e8f0; text-decoration: none; padding: 8px 16px; border-radius: 8px; background: rgba(255,255,255,0.1); margin-left: 8px; font-size: 14px; font-weight: 600; }
  .header nav a:hover { background: rgba(255,255,255,0.2); }
  .header nav a.primary { background: #fbbf24; color: #0f172a; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .page-title { margin-bottom: 20px; }
  .page-title h2 { font-size: 24px; color: #fbbf24; margin-bottom: 6px; }
  .page-title p { color: #94a3b8; font-size: 14px; }
  .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .filters select, .filters input { padding: 10px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 14px; min-width: 180px; outline: none; }
  .filters button { padding: 10px 20px; border-radius: 8px; border: none; background: #334155; color: #e2e8f0; font-weight: 600; cursor: pointer; }
  .classes-grid { display: grid; gap: 14px; }
  .class-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 16px; }
  .class-thumb { width: 80px; height: 60px; border-radius: 10px; background: #0f172a; background-size: cover; background-position: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .class-info { flex: 1; min-width: 0; }
  .class-info h3 { font-size: 15px; margin-bottom: 6px; }
  .class-info p { font-size: 12px; color: #94a3b8; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; margin-right: 6px; }
  .badge-live { background: #dc2626; color: white; }
  .badge-recorded { background: #10b981; color: white; }
  .badge-scheduled { background: #f59e0b; color: white; }
  .class-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-action { width: 38px; height: 38px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .btn-edit { background: #2563eb; color: white; }
  .btn-delete { background: #dc2626; color: white; }

  /* MODAL */
  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: none; align-items: flex-start; justify-content: center; z-index: 1000; padding: 20px; overflow-y: auto; }
  .modal.show { display: flex; }
  .modal-box { background: #1e293b; border-radius: 14px; padding: 24px; width: 100%; max-width: 800px; margin-top: 40px; }
  .modal-box h3 { color: #fbbf24; margin-bottom: 20px; font-size: 20px; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .form-group label { display: block; color: #94a3b8; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; font-family: inherit; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #fbbf24; }
  .form-group input[type="file"] { padding: 8px; cursor: pointer; background: #0f172a; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
  .btn { padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; font-size: 14px; }
  .btn-primary { background: #fbbf24; color: #0f172a; }
  .btn-primary:hover { background: #f59e0b; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .status { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 14px; }
  .status.success { background: #064e3b; color: #6ee7b7; display: block; }
  .status.error { background: #7f1d1d; color: #fca5a5; display: block; }
  .empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
  .empty h3 { font-size: 18px; margin-bottom: 8px; }
  .loading { text-align: center; padding: 40px; color: #94a3b8; }
  .section-title { color: #fbbf24; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 12px; border-top: 1px solid #334155; padding-top: 16px; }
  .section-title:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  @media (max-width: 600px) {
    .class-card { flex-direction: column; align-items: flex-start; }
    .class-actions { width: 100%; justify-content: flex-end; }
    .modal-actions { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>⚙️ Classes Manager</h1>
  <nav>
    <a href="/admin-dashboard.html">← Admin Home</a>
    <a href="#" onclick="logout()">Logout</a>
  </nav>
</div>

<div class="container">
  <div class="page-title">
    <h2>📚 Classes Manager</h2>
    <p>Live, Recorded, Scheduled classes manage karo</p>
  </div>

  <div id="status" class="status"></div>

  <!-- FILTERS -->
  <div class="filters">
    <select id="categoryFilter">
      <option value="">All Categories</option>
      <option value="Competitive">Competitive</option>
      <option value="School">School</option>
      <option value="General">General</option>
    </select>
    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="live">Live</option>
      <option value="recorded">Recorded</option>
      <option value="scheduled">Scheduled</option>
    </select>
    <button onclick="loadClasses()">🔄 Refresh</button>
    <button onclick="openCreateModal()" style="margin-left:auto;background:#fbbf24;color:#0f172a;">➕ New Class</button>
  </div>

  <!-- CLASSES LIST -->
  <div class="classes-grid" id="classesList">
    <div class="loading">⏳ Loading...</div>
  </div>
</div>

<!-- MODAL -->
<div id="classModal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle">➕ New Class</h3>

    <input type="hidden" id="editClassId">

    <!-- BASIC INFO -->
    <div class="section-title">📌 Basic Info</div>

    <div class="form-row">
      <div class="form-group">
        <label>Title (Hindi + English) *</label>
        <input type="text" id="title" placeholder="सिंधु घाटी सभ्यता || Indus Valley Civilization" required>
      </div>
      <div class="form-group">
        <label>Subtitle</label>
        <input type="text" id="subtitle" placeholder="Indus Valley Civilization – Part 01">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Category *</label>
        <select id="category" required>
          <option value="Competitive">Competitive</option>
          <option value="School">School</option>
          <option value="General">General</option>
        </select>
      </div>
      <div class="form-group">
        <label>Exam / Batch Name *</label>
        <input type="text" id="examName" placeholder="BSF || CRPF || ITBP || UP POLICE || UPSSSC PET" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Subject *</label>
        <input type="text" id="subject" placeholder="GENERAL STUDIES" required>
      </div>
      <div class="form-group">
        <label>Topic *</label>
        <input type="text" id="topic" placeholder="ANCIENT HISTORY" required>
      </div>
      <div class="form-group">
        <label>Teacher Name *</label>
        <input type="text" id="teacher" placeholder="Amresh Tiwari" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Duration (minutes) *</label>
        <input type="number" id="duration" value="60" required>
      </div>
      <div class="form-group">
        <label>Scheduled Date</label>
        <input type="date" id="scheduledDate">
      </div>
      <div class="form-group">
        <label>Scheduled Time</label>
        <input type="time" id="scheduledTime">
      </div>
    </div>

    <!-- VIDEO INFO -->
    <div class="section-title">🎥 Video Info</div>

    <div class="form-row">
      <div class="form-group">
        <label>Video Type *</label>
        <select id="videoType" required>
          <option value="recorded">▶ Recorded</option>
          <option value="live">🔴 Live</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status *</label>
        <select id="statusField" required>
          <option value="recorded">Recorded</option>
          <option value="live">Live</option>
          <option value="scheduled">Scheduled</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="grid-column:1/-1;">
        <label>YouTube Video URL (Live or Recorded)</label>
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
      </div>
    </div>

    <!-- MATERIAL -->
    <div class="section-title">📚 Class Material</div>

    <div class="form-row">
      <div class="form-group">
        <label>Thumbnail Image</label>
        <input type="file" id="thumbnailFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>Supporting PDF</label>
        <input type="file" id="pdfFile" accept=".pdf">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="grid-column:1/-1;">
        <label>Description</label>
        <textarea id="description" placeholder="Class ke baare me..."></textarea>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="grid-column:1/-1;">
        <label>Notes (Short Text)</label>
        <textarea id="notes" placeholder="Short notes for students..."></textarea>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveClass()">💾 Save Class</button>
    </div>
  </div>
</div>

<script>
let allClasses = [];
let currentUser = null;

function showStatus(msg, type) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + type;
  setTimeout(() => el.className = "status", 5000);
}

async function checkAuth() {
  try {
    const r = await fetch("/api/auth/me", { credentials: "include" });
    const data = await r.json();
    if (!data.user || data.user.role !== "admin") {
      window.location.href = "/login.html";
      return false;
    }
    currentUser = data.user;
    return true;
  } catch (e) {
    window.location.href = "/login.html";
    return false;
  }
}

async function loadClasses() {
  const box = document.getElementById("classesList");
  try {
    const category = document.getElementById("categoryFilter").value;
    const status = document.getElementById("statusFilter").value;

    let url = "/api/classes/admin/all";
    const params = [];
    if (category) params.push("category=" + encodeURIComponent(category));
    if (status) params.push("status=" + encodeURIComponent(status));
    if (params.length) url += "?" + params.join("&");

    const r = await fetch(url, { credentials: "include" });
    const data = await r.json();
    allClasses = data.data || [];

    if (!allClasses.length) {
      box.innerHTML = '<div class="empty"><h3>📚 Koi class nahi hai</h3><p>"New Class" button se pehli class banao</p></div>';
      return;
    }

    box.innerHTML = allClasses.map(c => {
      const thumbStyle = c.thumbnail ? 'background-image: url(\'' + c.thumbnail + '\');' : '';
      const statusClass = c.status === "live" ? "badge-live" : c.status === "scheduled" ? "badge-scheduled" : "badge-recorded";
      return '<div class="class-card">' +
        '<div class="class-thumb" style="' + thumbStyle + '">' + (!c.thumbnail ? "📹" : "") + '</div>' +
        '<div class="class-info">' +
          '<h3>' + escapeHtml(c.title || "Untitled") + '</h3>' +
          '<p>' +
            '<span class="badge ' + statusClass + '">' + (c.status || "recorded").toUpperCase() + '</span>' +
            escapeHtml(c.examName || "") + ' • ' + escapeHtml(c.subject || "") + ' • ' + escapeHtml(c.teacher || "") +
          '</p>' +
        '</div>' +
        '<div class="class-actions">' +
          '<button class="btn-action btn-edit" onclick="editClass(\'' + c._id + '\')">✏️</button>' +
          '<button class="btn-action btn-delete" onclick="deleteClass(\'' + c._id + '\')">🗑️</button>' +
        '</div>' +
      '</div>';
    }).join("");
  } catch (e) {
    box.innerHTML = '<div class="empty"><h3>❌ Failed to load</h3><p>' + e.message + '</p></div>';
  }
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function openCreateModal() {
  document.getElementById("modalTitle").textContent = "➕ New Class";
  document.getElementById("editClassId").value = "";
  clearForm();
  document.getElementById("classModal").classList.add("show");
}

function clearForm() {
  ["title","subtitle","examName","subject","topic","teacher","videoUrl","description","notes","scheduledDate","scheduledTime"].forEach(id => {
    document.getElementById(id).value = "";
  });
  document.getElementById("duration").value = "60";
  document.getElementById("category").value = "Competitive";
  document.getElementById("videoType").value = "recorded";
  document.getElementById("statusField").value = "recorded";
  document.getElementById("thumbnailFile").value = "";
  document.getElementById("pdfFile").value = "";
}

function editClass(id) {
  const c = allClasses.find(x => x._id === id);
  if (!c) return;

  document.getElementById("modalTitle").textContent = "✏️ Edit Class";
  document.getElementById("editClassId").value = id;
  document.getElementById("title").value = c.title || "";
  document.getElementById("subtitle").value = c.subtitle || "";
  document.getElementById("category").value = c.category || "Competitive";
  document.getElementById("examName").value = c.examName || "";
  document.getElementById("subject").value = c.subject || "";
  document.getElementById("topic").value = c.topic || "";
  document.getElementById("teacher").value = c.teacher || "";
  document.getElementById("duration").value = c.duration || 60;
  document.getElementById("scheduledDate").value = c.scheduledDate ? c.scheduledDate.split("T")[0] : "";
  document.getElementById("scheduledTime").value = c.scheduledTime || "";
  document.getElementById("videoType").value = c.videoType || "recorded";
  document.getElementById("statusField").value = c.status || "recorded";
  document.getElementById("videoUrl").value = c.liveUrl || c.recordedUrl || "";
  document.getElementById("description").value = c.description || "";
  document.getElementById("notes").value = c.notes || "";
  document.getElementById("thumbnailFile").value = "";
  document.getElementById("pdfFile").value = "";

  document.getElementById("classModal").classList.add("show");
}

function closeModal() {
  document.getElementById("classModal").classList.remove("show");
}

async function saveClass() {
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  btn.textContent = "⏳ Saving...";

  try {
    const id = document.getElementById("editClassId").value;
    const title = document.getElementById("title").value.trim();
    const examName = document.getElementById("examName").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const topic = document.getElementById("topic").value.trim();
    const teacher = document.getElementById("teacher").value.trim();

    if (!title) { showStatus("❌ Title required", "error"); btn.disabled = false; btn.textContent = "💾 Save Class"; return; }
    if (!examName) { showStatus("❌ Exam name required", "error"); btn.disabled = false; btn.textContent = "💾 Save Class"; return; }
    if (!subject) { showStatus("❌ Subject required", "error"); btn.disabled = false; btn.textContent = "💾 Save Class"; return; }
    if (!teacher) { showStatus("❌ Teacher name required", "error"); btn.disabled = false; btn.textContent = "💾 Save Class"; return; }

    const formData = new FormData();
    formData.append("title", title);
    formData.append("subtitle", document.getElementById("subtitle").value);
    formData.append("category", document.getElementById("category").value);
    formData.append("examName", examName);
    formData.append("subject", subject);
    formData.append("topic", topic);
    formData.append("teacher", teacher);
    formData.append("duration", document.getElementById("duration").value || 60);
    formData.append("scheduledDate", document.getElementById("scheduledDate").value);
    formData.append("scheduledTime", document.getElementById("scheduledTime").value);
    formData.append("videoType", document.getElementById("videoType").value);
    formData.append("status", document.getElementById("statusField").value);
    formData.append("liveUrl", document.getElementById("videoUrl").value);
    formData.append("recordedUrl", document.getElementById("videoUrl").value);
    formData.append("description", document.getElementById("description").value);
    formData.append("notes", document.getElementById("notes").value);

    const thumbFile = document.getElementById("thumbnailFile").files[0];
    if (thumbFile) formData.append("thumbnail", thumbFile);

    const pdfFile = document.getElementById("pdfFile").files[0];
    if (pdfFile) formData.append("supportingPdf", pdfFile);

    const url = id ? "/api/classes/" + id : "/api/classes";
    const method = id ? "PUT" : "POST";

    const r = await fetch(url, {
      method: method,
      body: formData,
      credentials: "include"
    });

    const data = await r.json();

    if (data.success) {
      showStatus("✅ Class saved successfully!", "success");
      closeModal();
      loadClasses();
    } else {
      showStatus("❌ " + (data.message || "Failed"), "error");
    }
  } catch (e) {
    showStatus("❌ " + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "💾 Save Class";
  }
}

async function deleteClass(id) {
  if (!confirm("Class delete karein?")) return;
  try {
    const r = await fetch("/api/classes/" + id, {
      method: "DELETE",
      credentials: "include"
    });
    const data = await r.json();
    if (data.success) {
      showStatus("✅ Deleted", "success");
      loadClasses();
    } else {
      showStatus("❌ " + data.message, "error");
    }
  } catch (e) {
    showStatus("❌ " + e.message, "error");
  }
}

async function logout() {
  await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
  window.location.href = "/";
}

document.getElementById("categoryFilter").addEventListener("change", loadClasses);
document.getElementById("statusFilter").addEventListener("change", loadClasses);

(async function() {
  const ok = await checkAuth();
  if (ok) loadClasses();
})();
</script>
</body>
</html>
