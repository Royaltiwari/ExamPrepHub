<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
    .top-bar { background: linear-gradient(135deg, #1e1b4b, #312e81); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .back-btn { background: rgba(255,255,255,0.1); border: none; width: 38px; height: 38px; border-radius: 10px; color: white; cursor: pointer; font-size: 18px; }
    .title-bar { color: white; font-size: 16px; font-weight: 900; flex: 1; text-align: center; }
    .container { max-width: 800px; margin: auto; padding: 20px; }
    .day-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .day-head { font-size: 14px; font-weight: 900; color: var(--primary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .class-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .class-row:last-child { border-bottom: none; }
    .time { background: var(--gradient-blue); color: white; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 12px; min-width: 80px; text-align: center; }
    .info { flex: 1; }
    .info h4 { font-size: 14px; margin-bottom: 3px; }
    .info p { font-size: 11px; color: var(--muted); }
    .empty-box { text-align: center; padding: 60px 20px; color: var(--muted); background: var(--card-bg); border: 1px dashed var(--border); border-radius: 14px; font-size: 14px; }
    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); padding: 8px 0; z-index: 99; }
    .bottom-nav-inner { display: flex; justify-content: space-around; max-width: 500px; margin: auto; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 700; padding: 4px 12px; }
    .bottom-nav a .ic { font-size: 20px; }
    @media (max-width: 700px) { .bottom-nav { display: block; } }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="location.href='/dashboard.html'">←</button>
  <div class="title-bar">📅 Schedule</div>
  <button class="back-btn" onclick="location.href='/dashboard.html'">🏠</button>
</div>

<div class="container">
  <div id="scheduleBox"><div class="empty-box">Loading...</div></div>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/dashboard.html"><span class="ic">🏠</span> Home</a>
    <a href="/home-class.html"><span class="ic">📚</span> Learn</a>
    <a href="/test-center.html"><span class="ic">📝</span> Tests</a>
    <a href="/progress.html"><span class="ic">📊</span> Progress</a>
    <a href="/profile.html"><span class="ic">👤</span> Profile</a>
  </div>
</nav>

<script src="/js/common.js"></script>
<script>
  async function loadSchedule() {
    const box = document.getElementById("scheduleBox");
    try {
      const r = await fetch("/api/classes?status=scheduled", { credentials: "include" });
      const data = await r.json();
      const list = data.data || [];

      if (!list.length) {
        box.innerHTML = '<div class="empty-box">📅 Koi scheduled class nahi hai</div>';
        return;
      }

      const grouped = {};
      list.forEach(c => {
        const d = c.scheduledDate ? new Date(c.scheduledDate).toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "short" }) : "Unknown";
        if (!grouped[d]) grouped[d] = [];
        grouped[d].push(c);
      });

      box.innerHTML = Object.keys(grouped).map(day => '<div class="day-card"><div class="day-head">📅 ' + day + '</div>' + grouped[day].map(c => '<div class="class-row"><div class="time">' + escapeHtml(c.scheduledTime || "TBA") + '</div><div class="info"><h4>' + escapeHtml(c.title || "") + '</h4><p>' + escapeHtml(c.examName || "") + ' • ' + escapeHtml(c.subject || "") + '</p></div></div>').join("") + '</div>').join("");
    } catch (e) {
      box.innerHTML = '<div class="empty-box">❌ ' + escapeHtml(e.message) + '</div>';
    }
  }

  (async function() {
    const user = await requireLogin();
    if (!user) return;
    loadSchedule();
  })();
</script>
</body>
</html>
