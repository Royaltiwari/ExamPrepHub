<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mock Test - ExamPrepHub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #2563eb;
      color: white;
      padding: 15px 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
    }

    .timer {
      background: white;
      color: #1d4ed8;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 800;
      min-width: 95px;
      text-align: center;
    }

    .timer.warning {
      color: #b91c1c;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1000px;
      margin: auto;
      padding: 22px 18px 40px;
    }

    .test-title {
      background: white;
      padding: 18px 20px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    .test-title h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .test-title p {
      color: #64748b;
      font-size: 14px;
    }

    /* =========================
       LAYOUT
    ========================= */

    .layout {
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 18px;
    }

    .question-card,
    .navigation-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    .question-card {
      padding: 24px;
    }

    .question-number {
      color: #2563eb;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .question-text {
      font-size: 19px;
      line-height: 1.55;
      margin-bottom: 22px;
      font-weight: 600;
    }

    /* =========================
       OPTIONS
    ========================= */

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .option:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .option.selected {
      border-color: #2563eb;
      background: #dbeafe;
    }

    .option input {
      margin-top: 4px;
      accent-color: #2563eb;
    }

    .option-text {
      line-height: 1.5;
      font-size: 15px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 25px;
    }

    .btn {
      border: none;
      padding: 12px 20px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .previous-btn {
      background: #e2e8f0;
      color: #334155;
    }

    .next-btn {
      background: #2563eb;
      color: white;
    }

    .submit-btn {
      background: #16a34a;
      color: white;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       QUESTION NAVIGATION
    ========================= */

    .navigation-card {
      padding: 18px;
      height: fit-content;
    }

    .navigation-card h3 {
      margin-bottom: 15px;
      font-size: 16px;
    }

    .question-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .question-btn {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
    }

    .question-btn.current {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .question-btn.answered {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }

    .question-btn.current.answered {
      background: #2563eb;
      color: white;
    }

    .legend {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
      line-height: 2;
    }

    .legend span {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 3px;
      margin-right: 5px;
    }

    .legend-current {
      background: #2563eb;
    }

    .legend-answered {
      background: #dcfce7;
      border: 1px solid #86efac;
    }

    .legend-unanswered {
      background: white;
      border: 1px solid #cbd5e1;
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .center-message {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 14px;
      color: #64748b;
    }

    .error {
      color: #b91c1c;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      .layout {
        grid-template-columns: 1fr;
      }

      .navigation-card {
        order: 2;
      }

      .question-card {
        order: 1;
      }

      .question-grid {
        grid-template-columns: repeat(8, 1fr);
      }
    }

    @media (max-width: 500px) {

      header {
        padding: 12px;
      }

      .logo {
        font-size: 17px;
      }

      .timer {
        font-size: 13px;
        min-width: 82px;
        padding: 8px;
      }

      main {
        padding: 14px 10px 30px;
      }

      .question-card {
        padding: 17px;
      }

      .question-text {
        font-size: 17px;
      }

      .buttons {
        flex-wrap: wrap;
      }

      .btn {
        flex: 1;
      }

      .question-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>
    <div class="header-inner">

      <div class="logo">
        🏆 ExamPrepHub
      </div>

      <div class="timer" id="timer">
        00:00
      </div>

    </div>
  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main id="main">

    <div class="center-message">
      Loading test...
    </div>

  </main>


  <script>

    // =====================================
    // GET TEST ID FROM URL
    // =====================================

    const params = new URLSearchParams(window.location.search);

    const testId = params.get("id");


    // =====================================
    // VARIABLES
    // =====================================

    let test = null;
    let questions = [];
    let currentQuestion = 0;
    let answers = {};
    let remainingSeconds = 0;
    let timerInterval = null;
    let submitting = false;


    const main = document.getElementById("main");
    const timerElement = document.getElementById("timer");


    // =====================================
    // CHECK TEST ID
    // =====================================

    if (!testId) {

      main.innerHTML = `
        <div class="center-message error">
          Test ID नहीं मिला।
          <br><br>
          Dashboard से test खोलें।
        </div>
      `;

    } else {

      initializeTest();

    }


    // =====================================
    // INITIALIZE TEST
    // =====================================

    async function initializeTest() {

      try {

        // पहले login check
        const userResponse = await fetch("/api/auth/me", {
          credentials: "include"
        });

        if (!userResponse.ok) {
          window.location.href = "/login.html";
          return;
        }


        // Test information
        const testResponse = await fetch(
          "/api/tests/" + encodeURIComponent(testId)
        );

        const testData = await testResponse.json();

        if (!testResponse.ok || !testData.success) {
          throw new Error(
            testData.message || "Test not found"
          );
        }

        test = testData.test;


        // Questions
        const questionResponse = await fetch(
          "/api/questions/test/" +
          encodeURIComponent(testId)
        );

        const questionData = await questionResponse.json();

        if (
          !questionResponse.ok ||
          !questionData.success
        ) {
          throw new Error(
            questionData.message ||
            "Unable to load questions"
          );
        }

        questions = questionData.questions || [];


        if (questions.length === 0) {

          main.innerHTML = `
            <div class="center-message">
              इस test में अभी कोई question उपलब्ध नहीं है।
            </div>
          `;

          return;
        }


        // Timer
        remainingSeconds =
          Number(test.duration || 30) * 60;


        renderTest();

        startTimer();

      } catch (error) {

        console.error("Initialize Test Error:", error);

        main.innerHTML = `
          <div class="center-message error">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }


    // =====================================
    // RENDER TEST
    // =====================================

    function renderTest() {

      main.innerHTML = `

        <div class="test-title">

          <h1>
            ${escapeHtml(test.name || "Mock Test")}
          </h1>

          <p>
            ${escapeHtml(test.exam || "Exam")}
            ${test.subject
              ? " • " + escapeHtml(test.subject)
              : ""}
            • ${questions.length} Questions
          </p>

        </div>


        <div class="layout">

          <section class="question-card">

            <div
              class="question-number"
              id="questionNumber"
            ></div>

            <div
              class="question-text"
              id="questionText"
            ></div>

            <div
              class="options"
              id="options"
            ></div>

            <div class="buttons">

              <button
                class="btn previous-btn"
                id="previousBtn"
                onclick="previousQuestion()"
              >
                ← Previous
              </button>

              <button
                class="btn next-btn"
                id="nextBtn"
                onclick="nextQuestion()"
              >
                Next →
              </button>

              <button
                class="btn submit-btn"
                id="submitBtn"
                onclick="submitTest()"
                style="display:none;"
              >
                Submit Test
              </button>

            </div>

          </section>


          <aside class="navigation-card">

            <h3>
              Question Navigation
            </h3>

            <div
              class="question-grid"
              id="questionGrid"
            ></div>

            <div class="legend">

              <div>
                <span class="legend-current"></span>
                Current
              </div>

              <div>
                <span class="legend-answered"></span>
                Answered
              </div>

              <div>
                <span class="legend-unanswered"></span>
                Not Answered
              </div>

            </div>

          </aside>

        </div>
      `;


      renderQuestion();

    }


    // =====================================
    // RENDER CURRENT QUESTION
    // =====================================

    function renderQuestion() {

      const question = questions[currentQuestion];

      const questionNumber =
        document.getElementById("questionNumber");

      const questionText =
        document.getElementById("questionText");

      const optionsContainer =
        document.getElementById("options");


      questionNumber.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;


      questionText.textContent =
        question.question;


      optionsContainer.innerHTML =
        question.options.map((option, index) => {

          const selected =
            answers[question._id] === index;


          return `

            <label
              class="option ${selected ? "selected" : ""}"
            >

              <input
                type="radio"
                name="answer"
                value="${index}"
                ${selected ? "checked" : ""}
                onchange="selectAnswer(${index})"
              >

              <span class="option-text">
                ${escapeHtml(option)}
              </span>

            </label>

          `;

        }).join("");


      updateButtons();

      renderQuestionGrid();

    }


    // =====================================
    // SELECT ANSWER
    // =====================================

    function selectAnswer(answerIndex) {

      const question = questions[currentQuestion];

      answers[question._id] = Number(answerIndex);

      renderQuestion();

    }


    // =====================================
    // NEXT
    // =====================================

    function nextQuestion() {

      if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        renderQuestion();

      }

    }


    // =====================================
    // PREVIOUS
    // =====================================

    function previousQuestion() {

      if (currentQuestion > 0) {

        currentQuestion--;

        renderQuestion();

      }

    }


    // =====================================
    // QUESTION NAVIGATION
    // =====================================

    function goToQuestion(index) {

      if (
        index >= 0 &&
        index < questions.length
      ) {

        currentQuestion = index;

        renderQuestion();

      }

    }


    function renderQuestionGrid() {

      const grid =
        document.getElementById("questionGrid");

      if (!grid) return;


      grid.innerHTML =
        questions.map((question, index) => {

          const answered =
            answers[question._id] !== undefined;


          return `

            <button
              class="question-btn
                ${index === currentQuestion ? "current" : ""}
                ${answered ? "answered" : ""}
              "
              onclick="goToQuestion(${index})"
            >
              ${index + 1}
            </button>

          `;

        }).join("");

    }


    // =====================================
    // BUTTON STATE
    // =====================================

    function updateButtons() {

      const previousBtn =
        document.getElementById("previousBtn");

      const nextBtn =
        document.getElementById("nextBtn");

      const submitBtn =
        document.getElementById("submitBtn");


      if (!previousBtn) return;


      previousBtn.disabled =
        currentQuestion === 0;


      if (currentQuestion === questions.length - 1) {

        nextBtn.style.display = "none";
        submitBtn.style.display = "block";

      } else {

        nextBtn.style.display = "block";
        submitBtn.style.display = "none";

      }

    }


    // =====================================
    // TIMER
    // =====================================

    function startTimer() {

      updateTimer();


      timerInterval = setInterval(() => {

        remainingSeconds--;

        updateTimer();


        if (remainingSeconds <= 0) {

          clearInterval(timerInterval);

          submitTest(true);

        }

      }, 1000);

    }


    function updateTimer() {

      const minutes =
        Math.floor(remainingSeconds / 60);

      const seconds =
        remainingSeconds % 60;


      timerElement.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");


      if (remainingSeconds <= 60) {
        timerElement.classList.add("warning");
      }

    }


    // =====================================
    // SUBMIT TEST
    // =====================================

    async function submitTest(autoSubmit = false) {

      if (submitting) return;


      if (!autoSubmit) {

        const unanswered =
          questions.length -
          Object.keys(answers).length;


        if (unanswered > 0) {

          const confirmSubmit = confirm(
            `${unanswered} question unanswered है। क्या आप test submit करना चाहते हैं?`
          );

          if (!confirmSubmit) {
            return;
          }

        } else {

          const confirmSubmit = confirm(
            "क्या आप test submit करना चाहते हैं?"
          );

          if (!confirmSubmit) {
            return;
          }

        }

      }


      submitting = true;


      if (timerInterval) {
        clearInterval(timerInterval);
      }


      const timeTaken =
        (Number(test.duration || 30) * 60) -
        remainingSeconds;


      const answerArray =
        Object.entries(answers).map(
          ([questionId, selectedAnswer]) => ({
            questionId,
            selectedAnswer
          })
        );


      try {

        const response = await fetch(
          "/api/results/submit",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
              testId,
              answers: answerArray,
              timeTaken
            })
          }
        );


        const data = await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.message ||
            "Unable to submit test"
          );

        }


        window.location.href =
          "/result.html?id=" +
          encodeURIComponent(data.result._id);


      } catch (error) {

        console.error("Submit Error:", error);

        alert(
          error.message ||
          "Test submit नहीं हो पाया।"
        );

        submitting = false;

      }

    }


    // =====================================
    // HTML SECURITY HELPER
    // =====================================

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
