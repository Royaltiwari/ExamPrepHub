<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="/login.html" class="logo">🏆 ExamPrepHub</a>
      <div class="header-actions">
        <a href="/login.html" class="btn-header">← Login</a>
      </div>
    </div>
  </header>

  <div style="min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card" style="max-width: 460px; width: 100%;">

      <div style="text-align: center; margin-bottom: 25px;">
        <div style="font-size: 42px; margin-bottom: 10px;">🔐</div>
        <h1 style="font-size: 22px; font-weight: 900; color: var(--primary); margin-bottom: 6px;">Forgot Password?</h1>
        <p class="text-muted" style="font-size: 14px;" id="stepSubtitle">Email daalo, hum OTP bhejenge</p>
      </div>

      <div style="display: flex; gap: 6px; margin-bottom: 25px;">
        <div class="step-dot" data-step="1" style="flex: 1; height: 4px; background: var(--primary); border-radius: 4px;"></div>
        <div class="step-dot" data-step="2" style="flex: 1; height: 4px; background: var(--border); border-radius: 4px;"></div>
        <div class="step-dot" data-step="3" style="flex: 1; height: 4px; background: var(--border); border-radius: 4px;"></div>
      </div>

      <div id="message" class="alert" style="display: none;"></div>

      <div id="step1">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="identifier" class="form-input" placeholder="aapka@email.com" />
        </div>
        <button class="btn btn-blue btn-block btn-lg" id="sendOtpBtn">Send OTP</button>
      </div>

      <div id="step2" style="display: none;">
        <p class="text-muted" style="font-size: 13px; margin-bottom: 12px;">
          OTP bhej diya gaya hai <strong id="sentTo"></strong> pe
        </p>
        <div class="form-group">
          <label>Enter 6-digit OTP</label>
          <input type="text" id="otp" class="form-input" placeholder="000000" maxlength="6" inputmode="numeric" />
        </div>
        <button class="btn btn-blue btn-block btn-lg" id="verifyOtpBtn">Verify OTP</button>
        <div style="text-align: center; margin-top: 12px;">
          <a href="#" id="resendOtp" style="font-size: 13px; color: var(--primary); font-weight: 700;">Resend OTP</a>
        </div>
      </div>

      <div id="step3" style="display: none;">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" class="form-input" placeholder="Kam se kam 6 characters" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Dobara password daalo" />
        </div>
        <button class="btn btn-green btn-block btn-lg" id="resetBtn">Reset Password</button>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <a href="/login.html" style="font-size: 13px; color: var(--muted);">← Back to Login</a>
      </div>

    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    let currentIdentifier = "";
    let currentOtp = "";

    const messageEl = document.getElementById("message");

    function showMessage(text, type = "error") {
      messageEl.textContent = text;
      messageEl.className = "alert alert-" + type;
      messageEl.style.display = "flex";
    }
    function hideMessage() { messageEl.style.display = "none"; }

    function setStep(step) {
      document.getElementById("step1").style.display = step === 1 ? "block" : "none";
      document.getElementById("step2").style.display = step === 2 ? "block" : "none";
      document.getElementById("step3").style.display = step === 3 ? "block" : "none";

      document.querySelectorAll(".step-dot").forEach((dot, idx) => {
        dot.style.background = idx < step ? "var(--primary)" : "var(--border)";
      });

      const subtitles = {
        1: "Email daalo, hum OTP bhejenge",
        2: "OTP enter karo jo email pe aaya hai",
        3: "Naya password set karo"
      };
      document.getElementById("stepSubtitle").textContent = subtitles[step];
      hideMessage();
    }

    document.getElementById("sendOtpBtn").addEventListener("click", async () => {
      const val = document.getElementById("identifier").value.trim();
      if (!val) { showMessage("Email daalo", "error"); return; }
      if (!val.includes("@")) { showMessage("Valid email daalo", "error"); return; }

      const btn = document.getElementById("sendOtpBtn");
      const orig = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span> Sending...';
      btn.disabled = true;

      try {
        const r = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: val })
        });
        const data = await r.json();

        if (!data.success) {
          showMessage(data.message, "error");
          return;
        }

        currentIdentifier = val;
        document.getElementById("sentTo").textContent = val;
        showMessage(data.message, "success");
        setStep(2);

      } catch (e) {
        showMessage("Server error", "error");
      } finally {
        btn.innerHTML = orig;
        btn.disabled = false;
      }
    });

    document.getElementById("verifyOtpBtn").addEventListener("click", async () => {
      const otp = document.getElementById("otp").value.trim();
      if (!otp || otp.length !== 6) {
        showMessage("6-digit OTP daalo", "error");
        return;
      }

      const btn = document.getElementById("verifyOtpBtn");
      const orig = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span> Verifying...';
      btn.disabled = true;

      try {
        const r = await fetch("/api/auth/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: currentIdentifier, otp })
        });
        const data = await r.json();

        if (!data.success) {
          showMessage(data.message, "error");
          return;
        }

        currentOtp = otp;
        showMessage("OTP verified! Ab naya password set karo.", "success");
        setStep(3);

      } catch (e) {
        showMessage("Server error", "error");
      } finally {
        btn.innerHTML = orig;
        btn.disabled = false;
      }
    });

    document.getElementById("resetBtn").addEventListener("click", async () => {
      const np = document.getElementById("newPassword").value;
      const cp = document.getElementById("confirmPassword").value;

      if (!np || np.length < 6) { showMessage("Password kam se kam 6 characters", "error"); return; }
      if (np !== cp) { showMessage("Passwords match nahi kar rahe", "error"); return; }

      const btn = document.getElementById("resetBtn");
      const orig = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span> Resetting...';
      btn.disabled = true;

      try {
        const r = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: currentIdentifier, otp: currentOtp, newPassword: np })
        });
        const data = await r.json();

        if (!data.success) {
          showMessage(data.message, "error");
          return;
        }

        showMessage("✅ Password reset! Login page pe redirect...", "success");
        setTimeout(() => { window.location.href = "/login.html"; }, 2000);

      } catch (e) {
        showMessage("Server error", "error");
      } finally {
        btn.innerHTML = orig;
        btn.disabled = false;
      }
    });

    document.getElementById("resendOtp").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("sendOtpBtn").click();
    });
  </script>

</body>
</html>
