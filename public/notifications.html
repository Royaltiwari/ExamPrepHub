<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
    .top-bar { background: linear-gradient(135deg, #1e1b4b, #312e81); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .back-btn { background: rgba(255,255,255,0.1); border: none; width: 38px; height: 38px; border-radius: 10px; color: white; cursor: pointer; font-size: 18px; }
    .title-bar { color: white; font-size: 16px; font-weight: 900; flex: 1; text-align: center; }
    .container { max-width: 800px; margin: auto; padding: 20px; }
    .notif-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; gap: 14px; transition: all 0.2s; }
    .notif-item:hover { border-color: var(--primary); }
    .notif-item.unread { border-left: 4px solid var(--primary); }
    .notif-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--gradient-blue); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .notif-body { flex: 1; min-width: 0; }
    .notif-body h4 { font-size: 14px; margin-bottom: 4px; }
    .notif-body p { font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 6px; }
    .notif-time { font-size: 11px; color: var(--muted); }
    .empty-box { text-align: center; padding: 60px 20px; color: var(--muted); background: var(--card-bg); border: 1px dashed var(--border); border-radius: 14px; font-size: 14px; }
    .mark-all-btn { background: var(--gradient-green); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; margin-bottom: 15px; }
    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); padding: 8px 0; z-index: 99; }
    .bottom-nav-inner { display: flex; justify-content: space-around; max-width: 500px; margin: auto; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 700; padding: 4px 12px; }
    .bottom-nav a .ic { font-size: 20px; }
    @media (max-width: 700px) { .bottom-nav { display: block; } }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="location.href='/dashboard.html'">←</button>
  <div class="title-bar">🔔 Notifications</div>
  <button class="back-btn" onclick="location.href='/dashboard.html'">🏠</button>
</div>

<div class="container">
  <button class="mark-all-btn" id="markAllBtn">✅ Mark All as Read</button>
  <div id="notifBox"><div class="empty-box">Loading...</div></div>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/dashboard.html"><span class="ic">🏠</span> Home</a>
    <a href="/home-class.html"><span class="ic">📚</span> Learn</a>
    <a href="/test-center.html"><span class="ic">📝</span> Tests</a>
    <a href="/progress.html"><span class="ic">📊</span> Progress</a>
    <a href="/profile.html"><span class="ic">👤</span> Profile</a>
  </div>
</nav>

<script src="/js/common.js"></script>
<script>
  async function loadNotifs() {
    const box = document.getElementById("notifBox");
    try {
      const r = await fetch("/api/notifications/my", { credentials: "include" });
      const data = await r.json();
      const list = data.data || [];

      if (!list.length) {
        box.innerHTML = '<div class="empty-box">🔔 Koi notification nahi hai</div>';
        return;
      }

      box.innerHTML = list.map(n => {
        const iconMap = { live: "🔴", pdf: "📄", test: "📝", result: "🏆", announcement: "📢" };
        const icon = iconMap[n.type] || "🔔";
        return '<div class="notif-item ' + (n.isRead ? '' : 'unread') + '"><div class="notif-icon">' + icon + '</div><div class="notif-body"><h4>' + escapeHtml(n.title || "") + '</h4><p>' + escapeHtml(n.message || "") + '</p><div class="notif-time">' + new Date(n.createdAt).toLocaleString("en-IN") + '</div></div></div>';
      }).join("");
    } catch (e) {
      box.innerHTML = '<div class="empty-box">❌ ' + escapeHtml(e.message) + '</div>';
    }
  }

  document.getElementById("markAllBtn").addEventListener("click", async () => {
    try {
      await fetch("/api/notifications/read-all", { method: "POST", credentials: "include" });
      loadNotifs();
    } catch (e) {}
  });

  (async function() {
    const user = await requireLogin();
    if (!user) return;
    loadNotifs();
  })();
</script>
</body>
</html>
