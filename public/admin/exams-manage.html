<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Manage Exams - ExamPrepHub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .header { background: #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 20px; color: #fbbf24; }
  .header nav a { color: #e2e8f0; text-decoration: none; padding: 8px 16px; border-radius: 6px; background: #334155; margin-left: 8px; font-size: 14px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
  .card h2 { color: #fbbf24; margin-bottom: 16px; font-size: 18px; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .form-group label { display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
  .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .btn-primary { background: #fbbf24; color: #0f172a; }
  .btn-danger { background: #dc2626; color: white; padding: 6px 12px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
  th { background: #0f172a; color: #94a3b8; font-size: 12px; text-transform: uppercase; }
  .status { padding: 12px; border-radius: 6px; margin-bottom: 16px; display: none; }
  .status.success { background: #064e3b; color: #10b981; display: block; }
  .status.error { background: #7f1d1d; color: #f87171; display: block; }
  .empty { text-align: center; padding: 40px; color: #94a3b8; }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; }
  .badge-school { background: #dbeafe; color: #1e40af; }
  .badge-competitive { background: #fef3c7; color: #92400e; }
</style>
</head>
<body>
<div class="header">
  <h1>📚 Manage Exams</h1>
  <nav><a href="/admin-dashboard.html">← Admin</a></nav>
</div>
<div class="container">
  <div id="status" class="status"></div>
  <div class="card">
    <h2>➕ नया Exam जोड़ें</h2>
    <div class="form-row">
      <div class="form-group"><label>Exam Name *</label><input type="text" id="examName" placeholder="SSC GD"></div>
      <div class="form-group"><label>Category</label>
        <select id="examCategory">
          <option value="School">School</option>
          <option value="Competitive" selected>Competitive</option>
          <option value="General">General</option>
        </select>
      </div>
      <div class="form-group"><label>Order</label><input type="number" id="examOrder" placeholder="0"></div>
    </div>
    <button class="btn btn-primary" onclick="addExam()">💾 Save Exam</button>
  </div>
  <div class="card">
    <h2>📋 All Exams <span id="countBadge" style="color:#fbbf24;"></span></h2>
    <table>
      <thead><tr><th>#</th><th>Name</th><th>Category</th><th>Order</th><th>Actions</th></tr></thead>
      <tbody id="examsTable"><tr><td colspan="5" class="empty">⏳ Loading...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
let allExams = [];
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
  setTimeout(() => el.className = 'status', 4000);
}
async function loadExams() {
  try {
    const res = await fetch('/api/exams');
    const data = await res.json();
    allExams = data.data || [];
    document.getElementById('countBadge').textContent = '(' + allExams.length + ')';
    const tbody = document.getElementById('examsTable');
    if (!allExams.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">कोई exam नहीं है। ऊपर से add करें।</td></tr>';
      return;
    }
    tbody.innerHTML = allExams.map((e, i) => {
      const cls = e.category === 'School' ? 'badge-school' : 'badge-competitive';
      return '<tr><td>' + (i + 1) + '</td><td><strong>' + e.name + '</strong></td><td><span class="badge ' + cls + '">' + (e.category || 'General') + '</span></td><td>' + (e.order || 0) + '</td><td><button class="btn btn-danger" onclick="deleteExam(\'' + e._id + '\')">🗑️ Delete</button></td></tr>';
    }).join('');
  } catch (e) { showStatus('❌ ' + e.message, 'error'); }
}
async function addExam() {
  const name = document.getElementById('examName').value.trim();
  const category = document.getElementById('examCategory').value;
  const order = parseInt(document.getElementById('examOrder').value) || 0;
  if (!name) { showStatus('❌ Exam name required', 'error'); return; }
  try {
    const res = await fetch('/api/exams', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ name, category, order })
    });
    const data = await res.json();
    if (data.success) {
      showStatus('✅ Exam added', 'success');
      document.getElementById('examName').value = '';
      document.getElementById('examOrder').value = '';
      loadExams();
    } else { showStatus('❌ ' + data.message, 'error'); }
  } catch (e) { showStatus('❌ ' + e.message, 'error'); }
}
async function deleteExam(id) {
  if (!confirm('Delete करें?')) return;
  try {
    const res = await fetch('/api/exams/' + id, { method: 'DELETE', credentials: 'include' });
    const data = await res.json();
    if (data.success) { showStatus('✅ Deleted', 'success'); loadExams(); }
    else { showStatus('❌ ' + data.message, 'error'); }
  } catch (e) { showStatus('❌ ' + e.message, 'error'); }
}
loadExams();
</script>
</body>
</html>
