<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Manage Subjects - ExamPrepHub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .header { background: #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 20px; color: #fbbf24; }
  .header nav a { color: #e2e8f0; text-decoration: none; padding: 8px 16px; border-radius: 6px; background: #334155; margin-left: 8px; font-size: 14px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
  .card h2 { color: #fbbf24; margin-bottom: 16px; font-size: 18px; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .form-group label { display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
  .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
  .form-group input:focus { border-color: #fbbf24; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .btn-primary { background: #fbbf24; color: #0f172a; }
  .btn-danger { background: #dc2626; color: white; padding: 6px 12px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
  th { background: #0f172a; color: #94a3b8; font-size: 12px; text-transform: uppercase; }
  .status { padding: 12px; border-radius: 6px; margin-bottom: 16px; display: none; }
  .status.success { background: #064e3b; color: #10b981; display: block; }
  .status.error { background: #7f1d1d; color: #f87171; display: block; }
  .empty { text-align: center; padding: 40px; color: #94a3b8; }
</style>
</head>
<body>
<div class="header">
  <h1>📚 Manage Subjects</h1>
  <nav>
    <a href="/admin.html">← Admin</a>
    <a href="/test.html">📝 Tests</a>
  </nav>
</div>
<div class="container">
  <div id="status" class="status"></div>
  <div class="card">
    <h2>➕ नया Subject जोड़ें</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Subject Name (English) *</label>
        <input type="text" id="subName" placeholder="Physics">
      </div>
      <div class="form-group">
        <label>Subject Name (Hindi) *</label>
        <input type="text" id="subNameHi" placeholder="भौतिक विज्ञान">
      </div>
      <div class="form-group">
        <label>Icon (Emoji)</label>
        <input type="text" id="subIcon" placeholder="⚛️" maxlength="4">
      </div>
      <div class="form-group">
        <label>Order</label>
        <input type="number" id="subOrder" placeholder="0">
      </div>
    </div>
    <button class="btn btn-primary" onclick="addSubject()">💾 Save Subject</button>
  </div>
  <div class="card">
    <h2>📋 सभी Subjects <span id="countBadge" style="color:#fbbf24;"></span></h2>
    <table>
      <thead>
        <tr><th>#</th><th>Icon</th><th>English</th><th>Hindi</th><th>Order</th><th>Actions</th></tr>
      </thead>
      <tbody id="subjectsTable"><tr><td colspan="6" class="empty">⏳ Loading...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
const API = '/api/subjects';
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
  setTimeout(() => el.className = 'status', 4000);
}
async function loadSubjects() {
  try {
    const res = await fetch(API, { credentials: 'include' });
    const data = await res.json();
    const list = data.data || [];
    document.getElementById('countBadge').textContent = '(' + list.length + ')';
    const tbody = document.getElementById('subjectsTable');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">कोई subject नहीं है।</td></tr>';
      return;
    }
    tbody.innerHTML = list.map((s, i) => '<tr><td>' + (i+1) + '</td><td style="font-size:28px;">' + (s.icon||'📚') + '</td><td><strong>' + s.name + '</strong></td><td>' + (s.name_hi||'-') + '</td><td>' + (s.order||0) + '</td><td><button class="btn btn-danger" onclick="deleteSubject(\'' + s._id + '\')">🗑️ Delete</button></td></tr>').join('');
  } catch (e) {
    showStatus('❌ ' + e.message, 'error');
  }
}
async function addSubject() {
  const name = document.getElementById('subName').value.trim();
  const name_hi = document.getElementById('subNameHi').value.trim();
  const icon = document.getElementById('subIcon').value.trim() || '📚';
  const order = parseInt(document.getElementById('subOrder').value) || 0;
  if (!name) { showStatus('❌ English name required', 'error'); return; }
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ name, name_hi, icon, order })
    });
    const data = await res.json();
    if (data.success) {
      showStatus('✅ Subject added', 'success');
      document.getElementById('subName').value = '';
      document.getElementById('subNameHi').value = '';
      document.getElementById('subIcon').value = '';
      document.getElementById('subOrder').value = '';
      loadSubjects();
    } else {
      showStatus('❌ ' + data.message, 'error');
    }
  } catch (e) {
    showStatus('❌ ' + e.message, 'error');
  }
}
async function deleteSubject(id) {
  if (!confirm('Delete करें?')) return;
  try {
    const res = await fetch(API + '/' + id, { method: 'DELETE', credentials: 'include' });
    const data = await res.json();
    if (data.success) { showStatus('✅ Deleted', 'success'); loadSubjects(); }
  } catch (e) { showStatus('❌ ' + e.message, 'error'); }
}
loadSubjects();
</script>
</body>
</html>
