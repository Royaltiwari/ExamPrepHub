<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
    .top-bar { background: linear-gradient(135deg, #1e1b4b, #312e81); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .back-btn { background: rgba(255,255,255,0.1); border: none; width: 38px; height: 38px; border-radius: 10px; color: white; cursor: pointer; font-size: 18px; }
    .title-bar { color: white; font-size: 16px; font-weight: 900; flex: 1; text-align: center; }
    .container { max-width: 900px; margin: auto; padding: 20px; }
    .page-header { text-align: center; margin-bottom: 25px; }
    .page-header h1 { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
    .page-header p { color: var(--muted); font-size: 14px; }
    .overall-card { background: linear-gradient(135deg, #1e1b4b, #312e81); border-radius: 20px; padding: 25px; text-align: center; color: white; margin-bottom: 25px; }
    .overall-card .label { font-size: 13px; opacity: 0.8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .overall-card .big-num { font-size: 56px; font-weight: 900; line-height: 1; margin-bottom: 15px; }
    .overall-card .bar { width: 100%; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
    .overall-card .bar-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #10b981); border-radius: 5px; }
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
    .stat-mini { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 12px; text-align: center; }
    .stat-mini .num { font-size: 24px; font-weight: 900; color: var(--primary); line-height: 1; }
    .stat-mini .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .section { margin-bottom: 25px; }
    .sec-head { font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
    .subj-list { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .subj-item { margin-bottom: 14px; }
    .subj-item:last-child { margin-bottom: 0; }
    .subj-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .subj-row .name { font-weight: 700; }
    .subj-row .score { font-weight: 900; color: var(--primary); }
    .subj-bar { width: 100%; height: 8px; background: var(--bg-alt); border-radius: 4px; overflow: hidden; }
    .subj-bar-fill { height: 100%; border-radius: 4px; }
    .test-list { display: grid; gap: 10px; }
    .test-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .test-item .left { flex: 1; }
    .test-item h4 { font-size: 14px; margin-bottom: 4px; }
    .test-item .meta { font-size: 11px; color: var(--muted); }
    .test-item .score-badge { background: var(--gradient-green); color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 900; }
    .test-item .score-badge.low { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    .test-item .score-badge.mid { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .empty-box { text-align: center; padding: 50px 20px; color: var(--muted); background: var(--card-bg); border: 1px dashed var(--border); border-radius: 14px; font-size: 14px; }
    .loading-box { text-align: center; padding: 40px; color: var(--muted); }
    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); padding: 8px 0; z-index: 99; }
    .bottom-nav-inner { display: flex; justify-content: space-around; max-width: 500px; margin: auto; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 700; padding: 4px 12px; }
    .bottom-nav a .ic { font-size: 20px; }
    .bottom-nav a.active { color: var(--primary); }
    @media (max-width: 700px) { .stats-row { grid-template-columns: repeat(2, 1fr); } .bottom-nav { display: block; } .container { padding: 15px; } .overall-card .big-num { font-size: 44px; } }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="location.href='/dashboard.html'">←</button>
  <div class="title-bar">📊 My Progress</div>
  <button class="back-btn" onclick="location.href='/dashboard.html'">🏠</button>
</div>

<div class="container">
  <div class="page-header">
    <h1>📊 My Progress</h1>
    <p>Your learning analytics and performance</p>
  </div>
  <div id="mainContent">
    <div class="loading-box">Loading progress...</div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/dashboard.html"><span class="ic">🏠</span> Home</a>
    <a href="/home-class.html"><span class="ic">📚</span> Learn</a>
    <a href="/test-center.html"><span class="ic">📝</span> Tests</a>
    <a href="/progress.html" class="active"><span class="ic">📊</span> Progress</a>
    <a href="/profile.html"><span class="ic">👤</span> Profile</a>
  </div>
</nav>

<script src="/js/common.js"></script>
<script>
  async function loadProgress() {
    const content = document.getElementById("mainContent");
    try {
      const r = await fetch("/api/progress/stats", { credentials: "include" });
      const data = await r.json();
      if (!data.success) throw new Error(data.message || "Failed");

      const stats = data.data;
      const prep = stats.overallPrep || 0;
      const avgScore = stats.avgScore || 0;

      let recentTests = [];
      try {
        const tr = await fetch("/api/progress/my", { credentials: "include" });
        const td = await tr.json();
        if (td.success) {
          recentTests = td.data
            .filter(p => p.type === "test" && p.completed)
            .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
            .slice(0, 5);
        }
      } catch (e) {}

      let html = '';

      html += '<div class="overall-card">' +
        '<div class="label">Overall Preparation</div>' +
        '<div class="big-num">' + prep + '%</div>' +
        '<div class="bar"><div class="bar-fill" style="width: ' + prep + '%;"></div></div>' +
      '</div>';

      html += '<div class="stats-row">' +
        '<div class="stat-mini"><div class="num">' + (stats.testsAttempted || 0) + '</div><div class="lbl">Tests</div></div>' +
        '<div class="stat-mini"><div class="num">' + avgScore + '%</div><div class="lbl">Avg Score</div></div>' +
        '<div class="stat-mini"><div class="num">' + (stats.totalQuestions || 0) + '</div><div class="lbl">Questions</div></div>' +
        '<div class="stat-mini"><div class="num">' + (stats.classesWatched || 0) + '</div><div class="lbl">Classes</div></div>' +
      '</div>';

      html += '<div class="section"><div class="sec-head">📚 Subject Performance</div>';

      if (stats.subjectWise && stats.subjectWise.length > 0) {
        html += '<div class="subj-list">';
        stats.subjectWise.forEach(s => {
          const score = s.avgScore || 0;
          let color = "linear-gradient(90deg, #22c55e, #10b981)";
          if (score < 50) color = "linear-gradient(90deg, #dc2626, #b91c1c)";
          else if (score < 75) color = "linear-gradient(90deg, #f59e0b, #d97706)";
          html += '<div class="subj-item">' +
            '<div class="subj-row"><span class="name">' + escapeHtml(s.subject) + '</span><span class="score">' + score + '%</span></div>' +
            '<div class="subj-bar"><div class="subj-bar-fill" style="width: ' + score + '%; background: ' + color + ';"></div></div>' +
          '</div>';
        });
        html += '</div>';
      } else {
        html += '<div class="empty-box">📭 Abhi tak koi test attempt nahi kiya.</div>';
      }

      html += '</div>';

      html += '<div class="section"><div class="sec-head">📝 Recent Tests</div>';

      if (recentTests.length > 0) {
        html += '<div class="test-list">';
        recentTests.forEach(t => {
          const score = t.score || 0;
          let badgeClass = "";
          if (score < 50) badgeClass = "low";
          else if (score < 75) badgeClass = "mid";
          html += '<div class="test-item">' +
            '<div class="left"><h4>' + escapeHtml(t.examName || "Test") + '</h4>' +
            '<div class="meta">' + new Date(t.updatedAt).toLocaleDateString("en-IN") + ' • ' + (t.questionsAttempted || 0) + ' Q</div></div>' +
            '<div class="score-badge ' + badgeClass + '">' + score + '%</div>' +
          '</div>';
        });
        html += '</div>';
      } else {
        html += '<div class="empty-box">📭 Abhi tak koi test complete nahi kiya.</div>';
      }

      html += '</div>';

      content.innerHTML = html;

    } catch (e) {
      content.innerHTML = '<div class="empty-box">❌ Progress load nahi ho payi: ' + escapeHtml(e.message) + '</div>';
    }
  }

  (async function() {
    const user = await requireLogin();
    if (!user) return;
    loadProgress();
  })();
</script>
</body>
</html>
