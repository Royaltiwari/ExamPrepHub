<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Manager - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 40px; }

    .top-bar {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .top-bar .logo { font-size: 18px; font-weight: 900; color: white; }
    .top-bar .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn-header {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white; padding: 8px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
    }
    .btn-header:hover { background: rgba(255,255,255,0.2); }

    .container { max-width: 1100px; margin: auto; padding: 20px; }

    .test-info {
      background: var(--card-bg); border: 1px solid var(--border);
      border-left: 5px solid var(--primary); border-radius: 12px;
      padding: 14px 18px; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
    }
    .test-info h2 { font-size: 16px; font-weight: 900; }
    .test-info .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .action-bar {
      display: flex; gap: 10px; margin-bottom: 16px;
      flex-wrap: wrap; align-items: center;
    }
    .btn {
      padding: 10px 16px; border-radius: 10px;
      font-weight: 800; font-size: 13px;
      border: none; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-blue { background: var(--gradient-blue); color: white; }
    .btn-green { background: var(--gradient-green); color: white; }
    .btn-gray { background: var(--card-hover); color: var(--text); border: 1px solid var(--border); }
    .btn-red { background: var(--gradient-red); color: white; }
    .btn-sm { padding: 6px 10px; font-size: 11px; }

    .search-bar {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px;
      display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .search-bar input, .search-bar select {
      padding: 10px 14px; background: var(--bg);
      border: 2px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 13px; flex: 1; min-width: 150px;
    }
    .search-bar input:focus, .search-bar select:focus { outline: none; border-color: var(--primary); }

    .q-list { display: flex; flex-direction: column; gap: 10px; }

    .q-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px;
      transition: all 0.15s; cursor: pointer;
    }
    .q-card:hover { border-color: var(--primary); }

    .q-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 6px; flex-wrap: wrap;
    }
    .q-num {
      background: var(--primary); color: white;
      padding: 2px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 800;
    }
    .q-subject {
      background: #1e3a8a; color: #93c5fd;
      padding: 2px 10px; border-radius: 6px;
      font-size: 10px; font-weight: 700;
    }
    .q-chapter {
      background: #4c1d95; color: #c4b5fd;
      padding: 2px 10px; border-radius: 6px;
      font-size: 10px; font-weight: 700;
    }
    .q-actions { display: flex; gap: 6px; }

    .q-text {
      font-size: 14px; font-weight: 600; line-height: 1.5;
      margin-bottom: 8px; color: var(--text);
    }

    .q-options { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .q-opt {
      background: var(--bg-alt); border: 1px solid var(--border);
      padding: 5px 10px; border-radius: 8px;
      font-size: 12px; color: var(--text-light);
      max-width: 100%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .q-opt.correct {
      background: #14532d; color: #86efac;
      border-color: #16a34a; font-weight: 800;
    }
    .q-opt.correct::before { content: "✅ "; }

    .q-details {
      display: none; margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 13px; color: var(--text-light);
    }
    .q-card.expanded .q-details { display: block; }
    .q-details strong { color: var(--text); }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 999;
      justify-content: center; align-items: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card-bg); border-radius: 16px;
      padding: 25px; max-width: 800px; width: 100%;
      max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 20px; font-weight: 900; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 800; font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 11px 14px; background: var(--bg);
      border: 2px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 14px;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); }
    .form-textarea { min-height: 70px; resize: vertical; }

    .lang-tabs {
      display: flex; gap: 6px; margin-bottom: 15px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0;
    }
    .lang-tab {
      padding: 10px 18px; border-radius: 10px 10px 0 0;
      font-weight: 800; font-size: 13px;
      cursor: pointer; border: none;
      background: var(--bg-alt); color: var(--muted);
      border-bottom: 3px solid transparent;
    }
    .lang-tab.active {
      background: var(--gradient-blue); color: white;
      border-bottom-color: var(--primary);
    }
    .lang-section { display: none; }
    .lang-section.active { display: block; }

    .opt-row {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .opt-label {
      background: var(--primary); color: white;
      width: 32px; height: 32px;
      border-radius: 8px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .bulk-preview {
      display: none; margin-top: 20px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
      max-height: 500px; overflow-y: auto;
    }
    .bulk-preview.show { display: block; }
    .bulk-preview h3 { font-size: 15px; font-weight: 900; margin-bottom: 12px; color: var(--primary); }
    .preview-question {
      background: var(--bg-alt); padding: 12px;
      border-radius: 8px; margin-bottom: 10px;
      font-size: 13px;
    }
    .preview-question strong { display: block; margin-bottom: 6px; }
    .preview-options { list-style: none; margin: 6px 0; }
    .preview-options li { padding: 3px 0; font-size: 12px; color: var(--text-light); }
    .preview-options li.correct { color: #86efac; font-weight: 800; }
    .preview-answer { font-size: 12px; color: var(--muted); margin-top: 6px; }

    .alert {
      padding: 12px 16px; border-radius: 10px; margin-bottom: 15px;
      display: none; font-size: 13px; font-weight: 700;
    }
    .alert.success { background: #14532d; color: #86efac; display: block; }
    .alert.error { background: #7f1d1d; color: #fca5a5; display: block; }
    .alert.info { background: #172554; color: #93c5fd; display: block; }

    .empty-box {
      text-align: center; padding: 40px 20px; color: var(--muted);
      background: var(--card-bg); border: 1px dashed var(--border);
      border-radius: 12px; font-size: 14px;
    }
    .loading-box { text-align: center; padding: 40px; color: var(--muted); }

    @media (max-width: 700px) {
      .q-card { padding: 10px 12px; }
      .q-text { font-size: 13px; }
      .q-opt { font-size: 11px; padding: 4px 8px; }
      .modal { padding: 18px; }
      .lang-tab { padding: 8px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="logo">❓ Question Manager</div>
    <div class="actions">
      <a href="/admin-tests.html" class="btn-header">← Tests</a>
      <a href="/admin-dashboard.html" class="btn-header">🏠 Dashboard</a>
    </div>
  </div>

  <div class="container">

    <div class="test-info">
      <div>
        <h2 id="testName">Loading test...</h2>
        <div class="meta" id="testMeta">-</div>
      </div>
      <div style="font-size: 13px; color: var(--muted);">
        Total: <strong id="qCount" style="color: var(--primary);">0</strong> questions
      </div>
    </div>
    <!-- TEST SELECTOR DROPDOWN -->
    <div id="testSelectorBox" style="display: none; background: #1e293b; padding: 16px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155;">
      <label style="display: block; color: #94a3b8; font-size: 13px; margin-bottom: 8px;">📋 Test चुनें:</label>
      <select id="testSelector" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none;">
        <option value="">-- Loading tests... --</option>
      </select>
    </div>

    <div class="action-bar">
      <button class="btn btn-green" id="addBtn">➕ Add Question</button>
      <button class="btn btn-blue" id="bulkBtn">📤 Bulk Import (Word/PDF)</button>
      <button class="btn btn-gray" onclick="location.reload()">🔄 Refresh</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 Search question..." />
      <select id="subjectFilter"><option value="">All Subjects</option></select>
    </div>

    <div id="msg" class="alert"></div>

    <div class="q-list" id="qList">
      <div class="loading-box">Loading questions...</div>
    </div>

    <div class="bulk-preview" id="bulkPreview">
      <h3>📋 Preview Questions</h3>
      <div id="previewContent"></div>
      <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
        <button class="btn btn-green" id="importBtn">✅ Import All Questions</button>
        <button class="btn btn-gray" id="cancelBulkBtn">Cancel</button>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2 id="modalTitle">➕ Add New Question</h2>

      <div class="lang-tabs">
        <button type="button" class="lang-tab active" data-lang="hindi">🇮🇳 हिंदी</button>
        <button type="button" class="lang-tab" data-lang="english">🇬🇧 English</button>
      </div>

      <div class="lang-section active" data-lang="hindi">
        <div class="form-group">
          <label>Question (Hindi) *</label>
          <textarea id="addQHindi" class="form-textarea" placeholder="प्रश्न हिंदी में..."></textarea>
        </div>
        <div class="form-group">
          <label>Options (Hindi)</label>
          <div class="opt-row"><div class="opt-label">A</div><input type="text" id="addOptAHindi" class="form-input" /></div>
          <div class="opt-row"><div class="opt-label">B</div><input type="text" id="addOptBHindi" class="form-input" /></div>
          <div class="opt-row"><div class="opt-label">C</div><input type="text" id="addOptCHindi" class="form-input" /></div>
          <div class="opt-row"><div class="opt-label">D</div><input type="text" id="addOptDHindi" class="form-input" /></div>
        </div>
        <div class="form-group">
          <label>Explanation (Hindi)</label>
          <textarea id="addExpHindi" class="form-textarea" placeholder="व्याख्या..."></textarea>
        </div>
      </div>

      <div class="lang-section" data-lang="english">
        <div class="form-group">
          <label>Question (English)</label>
          <textarea id="addQEnglish" class="form-textarea" placeholder="Question in English..."></textarea>
        </div>
        <div class="form-group">
          <label>Options (English)</label>
          <div class="opt-row"><div class="opt-label">A</div><input type="text" id="addOptAEnglish" class="form-input" /></div>
          <div class="opt-row"><div class="opt-label">B</div><input type="text" id="addOptBEnglish" class="form-input" /></div>
          <div class="opt-row"><div class="opt-label">C</div><input type="text" id="addOptCEnglish" class="form-input" /></div>
          <div class="opt-row"><div class="opt-label">D</div><input type="text" id="addOptDEnglish" class="form-input" /></div>
        </div>
        <div class="form-group">
          <label>Explanation (English)</label>
          <textarea id="addExpEnglish" class="form-textarea" placeholder="Explanation..."></textarea>
        </div>
      </div>

      <div class="form-group" style="margin-top: 20px;">
        <label>Correct Answer *</label>
        <select id="addCorrect" class="form-select">
          <option value="0">A</option>
          <option value="1">B</option>
          <option value="2">C</option>
          <option value="3">D</option>
        </select>
      </div>
      <div class="form-group"><label>Subject</label><input type="text" id="addSubject" class="form-input" placeholder="General Studies" /></div>
      <div class="form-group"><label>Chapter</label><input type="text" id="addChapter" class="form-input" placeholder="Indian History" /></div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-green" id="saveQBtn">💾 Save Question</button>
        <button class="btn btn-gray" id="cancelAddBtn">Cancel</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="bulkModal">
    <div class="modal">
      <h2>📤 Bulk Import Questions</h2>
      <p style="font-size: 13px; color: var(--muted); margin-bottom: 15px;">
        Word (.docx) ya PDF file upload karo — 20, 50, 100 ya zyada questions ek saath
      </p>
      <div class="form-group">
        <label>Language</label>
        <select id="bulkLanguage" class="form-select">
          <option value="bilingual">Bilingual (Hindi + English)</option>
          <option value="hindi">Hindi only</option>
          <option value="english">English only</option>
        </select>
      </div>
      <div class="form-group"><label>Subject</label><input type="text" id="bulkSubject" class="form-input" placeholder="General Studies" /></div>
      <div class="form-group"><label>Chapter</label><input type="text" id="bulkChapter" class="form-input" placeholder="Indian History" /></div>
      <div class="form-group">
        <label>File (PDF / DOCX)</label>
        <input type="file" id="bulkFile" class="form-input" accept=".pdf,.docx" />
        <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">Max 10 MB • PDF ya DOCX</div>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-blue" id="previewBtn">👁️ Preview Questions</button>
        <button class="btn btn-gray" id="cancelBulkModalBtn">Cancel</button>
      </div>
      <div id="bulkMsg" class="alert" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    const testId = getQueryParam("test");
    let allQuestions = [];
    let searchQ = "";
    let subjectF = "";
    let pendingPreview = [];
    let editingId = null;

    // ==========================================
    // UNIVERSAL OPTIONS EXTRACTOR
    // ==========================================
    function getOptions(q, lang) {
      if (q.options && typeof q.options === "object" && !Array.isArray(q.options)) {
        const h = q.options.hindi || {};
        const e = q.options.english || {};
        if (lang === "hindi" && (h.A || h.B || h.C || h.D)) {
          return [h.A || "", h.B || "", h.C || "", h.D || ""];
        }
        if (lang === "english" && (e.A || e.B || e.C || e.D)) {
          return [e.A || "", e.B || "", e.C || "", e.D || ""];
        }
        return [h.A || e.A || "", h.B || e.B || "", h.C || e.C || "", h.D || e.D || ""];
      }
      if (Array.isArray(q.optionsHindi) && q.optionsHindi.length) return q.optionsHindi;
      if (Array.isArray(q.optionsEnglish) && q.optionsEnglish.length) return q.optionsEnglish;
      if (Array.isArray(q.options) && q.options.length) return q.options;
      if (Array.isArray(q.optionsText) && q.optionsText.length) return q.optionsText;
      if (typeof q.options === "string" && q.options.trim()) {
        return q.options.split(/[|,\n]/).map(s => s.trim()).filter(Boolean);
      }
      return [];
    }

    // ==========================================
    // UNIVERSAL ANSWER EXTRACTOR
    // ==========================================
    function getCorrectIndex(q) {
      if (typeof q.correctAnswer === "number") return q.correctAnswer;
      if (typeof q.answer === "number") return q.answer;
      if (typeof q.answer === "string") {
        const a = q.answer.trim().toUpperCase();
        if (/^[A-D]$/.test(a)) return a.charCodeAt(0) - 65;
        if (/^[1-4]$/.test(a)) return Number(a) - 1;
      }
      if (typeof q.correctAnswer === "string") {
        const a = q.correctAnswer.trim().toUpperCase();
        if (/^[A-D]$/.test(a)) return a.charCodeAt(0) - 65;
        if (/^[1-4]$/.test(a)) return Number(a) - 1;
      }
      return 0;
    }

    // ==========================================
    // UNIVERSAL EXPLANATION EXTRACTOR
    // ==========================================
    function getExplanation(q, lang) {
      const h = q.hindiExplanation || q.explanationHindi || "";
      const e = q.englishExplanation || q.explanationEnglish || "";
      if (lang === "hindi") return h || e || q.explanation || "";
      if (lang === "english") return e || h || q.explanation || "";
      if (h && e && h !== e) return h + " | " + e;
      return h || e || q.explanation || "";
    }

    // ==========================================
    // LANGUAGE TAB SWITCHING
    // ==========================================
    document.querySelectorAll(".lang-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".lang-tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".lang-section").forEach(s => s.classList.remove("active"));
        tab.classList.add("active");
        document.querySelector('.lang-section[data-lang="' + tab.dataset.lang + '"]').classList.add("active");
      });
    });

    // ==========================================
    // LOAD TEST INFO
    // ==========================================
    async function loadTestInfo() {
      try {
        const r = await fetch("/api/admin/tests", { credentials: "include" });
        const data = await r.json();
        const test = (data.tests || []).find(t => String(t._id) === String(testId));
        if (test) {
          document.getElementById("testName").textContent = test.name || "Untitled Test";
          document.getElementById("testMeta").textContent =
            (test.exam || "-") + " • " + (test.subject || "-") + " • " + (test.duration || 0) + " min";
        }
      } catch (e) {}
    }

    // ==========================================
    // LOAD QUESTIONS
    // ==========================================
    async function loadQuestions() {
      const list = document.getElementById("qList");
      list.innerHTML = '<div class="loading-box">Loading questions...</div>';

      try {
        const r = await fetch("/api/questions/admin/test/" + testId, { credentials: "include" });
        const data = await r.json();
        allQuestions = data.questions || [];
        document.getElementById("qCount").textContent = allQuestions.length;

        const subjects = [...new Set(allQuestions.map(q => q.subject).filter(Boolean))];
        const sel = document.getElementById("subjectFilter");
        sel.innerHTML = '<option value="">All Subjects</option>' +
          subjects.map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>').join("");

        renderQuestions();
      } catch (e) {
        list.innerHTML = '<div class="empty-box">❌ ' + escapeHtml(e.message) + '</div>';
      }
    }

    // ==========================================
    // RENDER QUESTIONS LIST
    // ==========================================
    function renderQuestions() {
      const list = document.getElementById("qList");
      let filtered = allQuestions;

      if (searchQ) {
        const q = searchQ.toLowerCase();
        filtered = filtered.filter(x =>
          (x.questionHindi || x.hindiQuestion || "").toLowerCase().includes(q) ||
          (x.questionEnglish || x.englishQuestion || "").toLowerCase().includes(q) ||
          (x.questionText || "").toLowerCase().includes(q)
        );
      }
      if (subjectF) filtered = filtered.filter(x => x.subject === subjectF);

      if (!filtered.length) {
        list.innerHTML = '<div class="empty-box">📭 Koi question nahi mila.</div>';
        return;
      }

      list.innerHTML = filtered.map((q, idx) => {
        const qTextH = q.questionHindi || q.hindiQuestion || "";
        const qTextE = q.questionEnglish || q.englishQuestion || "";
        const options = getOptions(q);
        const correct = getCorrectIndex(q);

        let qTextHtml = "";
        if (qTextH) qTextHtml += '<div>🇮🇳 ' + escapeHtml(qTextH) + '</div>';
        if (qTextE && qTextE !== qTextH) qTextHtml += '<div style="color:var(--muted);margin-top:4px;">🇬🇧 ' + escapeHtml(qTextE) + '</div>';
        if (!qTextHtml) qTextHtml = '<div>' + escapeHtml(q.questionText || q.question || "(No text)") + '</div>';

        const optionsHtml = options.slice(0, 4).map((opt, i) =>
          '<span class="q-opt' + (i === correct ? ' correct' : '') + '">' +
            String.fromCharCode(65 + i) + '. ' + escapeHtml(opt) +
          '</span>'
        ).join("");

        const explanation = getExplanation(q);

        return '<div class="q-card" data-id="' + q._id + '">' +
          '<div class="q-header">' +
            '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">' +
              '<span class="q-num">Q' + (idx + 1) + '</span>' +
              (q.subject ? '<span class="q-subject">' + escapeHtml(q.subject) + '</span>' : '') +
              (q.chapter ? '<span class="q-chapter">' + escapeHtml(q.chapter) + '</span>' : '') +
            '</div>' +
            '<div class="q-actions">' +
              '<button class="btn btn-blue btn-sm" onclick="event.stopPropagation();editQ(\'' + q._id + '\')">✏️ Edit</button>' +
              '<button class="btn btn-red btn-sm" onclick="event.stopPropagation();delQ(\'' + q._id + '\')">🗑</button>' +
            '</div>' +
          '</div>' +
          '<div class="q-text">' + qTextHtml + '</div>' +
          '<div class="q-options">' + optionsHtml + '</div>' +
          '<div class="q-details"><strong>💡 Explanation:</strong> ' + escapeHtml(explanation) + '</div>' +
        '</div>';
      }).join("");

      document.querySelectorAll(".q-card").forEach(card => {
        card.addEventListener("click", () => card.classList.toggle("expanded"));
      });
    }

    // ==========================================
    // SEARCH + FILTER
    // ==========================================
    document.getElementById("searchInput").addEventListener("input", debounce((e) => {
      searchQ = e.target.value.trim();
      renderQuestions();
    }, 300));

    document.getElementById("subjectFilter").addEventListener("change", (e) => {
      subjectF = e.target.value;
      renderQuestions();
    });

    // ==========================================
    // OPEN ADD MODAL
    // ==========================================
    function clearForm() {
      ["addQHindi","addQEnglish","addOptAHindi","addOptBHindi","addOptCHindi","addOptDHindi",
       "addOptAEnglish","addOptBEnglish","addOptCEnglish","addOptDEnglish",
       "addExpHindi","addExpEnglish","addSubject","addChapter"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
      document.getElementById("addCorrect").value = "0";
      document.querySelectorAll(".lang-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".lang-section").forEach(s => s.classList.remove("active"));
      document.querySelector('.lang-tab[data-lang="hindi"]').classList.add("active");
      document.querySelector('.lang-section[data-lang="hindi"]').classList.add("active");
    }

    function openAddModal() {
      editingId = null;
      clearForm();
      document.getElementById("modalTitle").textContent = "➕ Add New Question";
      document.getElementById("addModal").classList.add("open");
    }

    document.getElementById("addBtn").addEventListener("click", openAddModal);

    // ==========================================
    // EDIT QUESTION
    // ==========================================
    function editQ(id) {
      const q = allQuestions.find(x => String(x._id) === String(id));
      if (!q) { showMsg("Question not found", "error"); return; }

      editingId = id;
      clearForm();
      document.getElementById("modalTitle").textContent = "✏️ Edit Question";

      document.getElementById("addQHindi").value = q.questionHindi || q.hindiQuestion || "";
      document.getElementById("addQEnglish").value = q.questionEnglish || q.englishQuestion || "";

      const optH = getOptions(q, "hindi");
      document.getElementById("addOptAHindi").value = optH[0] || "";
      document.getElementById("addOptBHindi").value = optH[1] || "";
      document.getElementById("addOptCHindi").value = optH[2] || "";
      document.getElementById("addOptDHindi").value = optH[3] || "";

      const optE = getOptions(q, "english");
      document.getElementById("addOptAEnglish").value = optE[0] || "";
      document.getElementById("addOptBEnglish").value = optE[1] || "";
      document.getElementById("addOptCEnglish").value = optE[2] || "";
      document.getElementById("addOptDEnglish").value = optE[3] || "";

      document.getElementById("addExpHindi").value = q.explanationHindi || q.hindiExplanation || "";
      document.getElementById("addExpEnglish").value = q.explanationEnglish || q.englishExplanation || "";

      document.getElementById("addCorrect").value = getCorrectIndex(q);
      document.getElementById("addSubject").value = q.subject || "";
      document.getElementById("addChapter").value = q.chapter || "";

      document.getElementById("addModal").classList.add("open");
    }

    document.getElementById("cancelAddBtn").addEventListener("click", () => {
      document.getElementById("addModal").classList.remove("open");
      editingId = null;
    });

    // ==========================================
    // SAVE (CREATE / UPDATE)
    // ==========================================
    document.getElementById("saveQBtn").addEventListener("click", async () => {
      const qHindi = document.getElementById("addQHindi").value.trim();
      const qEnglish = document.getElementById("addQEnglish").value.trim();
      const optAH = document.getElementById("addOptAHindi").value.trim();
      const optBH = document.getElementById("addOptBHindi").value.trim();
      const optCH = document.getElementById("addOptCHindi").value.trim();
      const optDH = document.getElementById("addOptDHindi").value.trim();
      const optAE = document.getElementById("addOptAEnglish").value.trim();
      const optBE = document.getElementById("addOptBEnglish").value.trim();
      const optCE = document.getElementById("addOptCEnglish").value.trim();
      const optDE = document.getElementById("addOptDEnglish").value.trim();
      const expHindi = document.getElementById("addExpHindi").value.trim();
      const expEnglish = document.getElementById("addExpEnglish").value.trim();
      const correct = Number(document.getElementById("addCorrect").value);
      const subject = document.getElementById("addSubject").value.trim();
      const chapter = document.getElementById("addChapter").value.trim();

      if (!qHindi && !qEnglish) { showMsg("Question text required (Hindi ya English)", "error"); return; }
      if (!optAH && !optAE) { showMsg("Options required", "error"); return; }

      const payload = {
        testId, subject, chapter, correctAnswer: correct,
        questionHindi: qHindi,
        questionEnglish: qEnglish,
        questionText: qHindi || qEnglish,
        question: qHindi || qEnglish,
        optionsHindi: [optAH, optBH, optCH, optDH],
        optionsEnglish: [optAE, optBE, optCE, optDE],
        options: [optAH || optAE, optBH || optBE, optCH || optCE, optDH || optDE],
        explanationHindi: expHindi,
        explanationEnglish: expEnglish,
        explanation: expHindi || expEnglish
      };

      try {
        const url = editingId ? "/api/questions/" + editingId : "/api/questions";
        const method = editingId ? "PUT" : "POST";

        const r = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(payload)
        });
        const data = await r.json();

        if (data.success) {
          showMsg(editingId ? "✅ Question updated!" : "✅ Question added!", "success");
          document.getElementById("addModal").classList.remove("open");
          editingId = null;
          loadQuestions();
        } else {
          showMsg(data.message || "Failed", "error");
        }
      } catch (e) { showMsg("Server error: " + e.message, "error"); }
    });

    // ==========================================
    // BULK IMPORT
    // ==========================================
    document.getElementById("bulkBtn").addEventListener("click", () => {
      document.getElementById("bulkModal").classList.add("open");
    });
    document.getElementById("cancelBulkModalBtn").addEventListener("click", () => {
      document.getElementById("bulkModal").classList.remove("open");
    });

    document.getElementById("previewBtn").addEventListener("click", async () => {
      const file = document.getElementById("bulkFile").files[0];
      if (!file) { showBulkMsg("File select karo", "error"); return; }

      const fd = new FormData();
      fd.append("pdfFile", file);
      fd.append("language", document.getElementById("bulkLanguage").value);
      fd.append("subject", document.getElementById("bulkSubject").value.trim());
      fd.append("chapter", document.getElementById("bulkChapter").value.trim());

      showBulkMsg("⏳ Parsing...", "info");

      try {
        const r = await fetch("/api/questions/bulk/preview", {
          method: "POST", credentials: "include", body: fd
        });
        const data = await r.json();

        if (data.success && data.questions?.length) {
          pendingPreview = data.questions;
          renderBulkPreview(data.questions);
          document.getElementById("bulkModal").classList.remove("open");
          document.getElementById("bulkPreview").classList.add("show");
          showBulkMsg("", "info");
        } else {
          showBulkMsg(data.message || "Parse failed", "error");
        }
      } catch (e) { showBulkMsg("Server error: " + e.message, "error"); }
    });

    // ==========================================
    // RENDER BULK PREVIEW
    // ==========================================
    function renderBulkPreview(questions) {
      document.getElementById("previewContent").innerHTML = questions.map((q, i) => {
        const qH = q.hindiQuestion || q.questionHindi || "";
        const qE = q.englishQuestion || q.questionEnglish || "";

        const optsH = getOptions(q, "hindi");
        const optsE = getOptions(q, "english");
        const correct = getCorrectIndex(q);
        const explanation = getExplanation(q);

        let qTextHtml = "";
        if (qH) qTextHtml += '<div style="color:#c4b5fd;margin-bottom:4px;">🇮🇳 ' + escapeHtml(qH) + '</div>';
        if (qE && qE !== qH) qTextHtml += '<div style="color:#93c5fd;margin-bottom:4px;">🇬🇧 ' + escapeHtml(qE) + '</div>';
        if (!qTextHtml) qTextHtml = '<div>' + escapeHtml(q.questionText || q.question || "(No text)") + '</div>';

        let optionsHtml = "";
        if (optsH.some(o => o)) {
          optionsHtml += '<div style="font-size:11px;color:#c4b5fd;margin-top:6px;">🇮🇳 Hindi:</div>';
          optionsHtml += '<ul class="preview-options">' + optsH.map((o, j) =>
            '<li class="' + (j === correct ? 'correct' : '') + '">' +
              String.fromCharCode(65 + j) + '. ' + escapeHtml(o) +
            '</li>'
          ).join("") + '</ul>';
        }

        const optsEAlagHai = optsE.some((o, j) => o && o !== optsH[j]);
        if (optsEAlagHai && optsE.some(o => o)) {
          optionsHtml += '<div style="font-size:11px;color:#93c5fd;margin-top:6px;">🇬🇧 English:</div>';
          optionsHtml += '<ul class="preview-options">' + optsE.map((o, j) =>
            '<li class="' + (j === correct ? 'correct' : '') + '">' +
              String.fromCharCode(65 + j) + '. ' + escapeHtml(o) +
            '</li>'
          ).join("") + '</ul>';
        }

        return '<div class="preview-question">' +
          '<strong>Q' + (i + 1) + '.</strong>' + qTextHtml +
          optionsHtml +
          '<div class="preview-answer">✅ Correct Answer: ' + String.fromCharCode(65 + correct) + '</div>' +
          (explanation ? '<div class="preview-answer">💡 ' + escapeHtml(explanation) + '</div>' : '') +
        '</div>';
      }).join("");
    }

    // ==========================================
    // IMPORT ALL QUESTIONS (FINAL FIX)
    // ==========================================
    document.getElementById("importBtn").addEventListener("click", async () => {
      if (!pendingPreview.length) { showMsg("Koi questions nahi", "error"); return; }

      // ⚡ NORMALIZE: Har question ko backend ke expected format me convert karo
      const normalized = pendingPreview.map((q, i) => {
        // Question text (dono naming conventions)
        const qHindi = q.hindiQuestion || q.questionHindi || "";
        const qEnglish = q.englishQuestion || q.questionEnglish || "";

        // Options (sab formats support)
        const optsH = getOptions(q, "hindi");
        const optsE = getOptions(q, "english");

        // Correct answer
        const correct = getCorrectIndex(q);

        // Explanation
        const expH = q.hindiExplanation || q.explanationHindi || "";
        const expE = q.englishExplanation || q.explanationEnglish || "";

        return {
          // Text (dono naming)
          questionHindi: qHindi,
          questionEnglish: qEnglish,
          questionText: qHindi || qEnglish || "(empty)",
          question: qHindi || qEnglish || "(empty)",

          // Options (dono naming)
          optionsHindi: [optsH[0] || "", optsH[1] || "", optsH[2] || "", optsH[3] || ""],
          optionsEnglish: [optsE[0] || "", optsE[1] || "", optsE[2] || "", optsE[3] || ""],
          options: [
            optsH[0] || optsE[0] || "",
            optsH[1] || optsE[1] || "",
            optsH[2] || optsE[2] || "",
            optsH[3] || optsE[3] || ""
          ],

          // Answer (number + string dono)
          correctAnswer: correct,
          answer: ["A","B","C","D"][correct] || "A",

          // Explanation (dono naming)
          explanationHindi: expH,
          explanationEnglish: expE,
          explanation: expH || expE || "",
          hindiExplanation: expH,
          englishExplanation: expE,

          // Original parser fields bhi rakh do (safety)
          hindiQuestion: qHindi,
          englishQuestion: qEnglish,

          // Meta
          subject: q.subject || document.getElementById("bulkSubject").value.trim() || "General",
          chapter: q.chapter || document.getElementById("bulkChapter").value.trim() || "General",
          questionNumber: q.questionNumber || (i + 1)
        };
      });

      // Debug: F12 Console me dekho kya bhej rahe ho
      console.log("📤 SENDING TO BACKEND:", JSON.stringify(normalized, null, 2));

      try {
        const r = await fetch("/api/questions/bulk/import", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            testId,
            language: document.getElementById("bulkLanguage").value,
            subject: document.getElementById("bulkSubject").value.trim(),
            chapter: document.getElementById("bulkChapter").value.trim(),
            questions: normalized
          })
        });

        const data = await r.json();
        console.log("📥 BACKEND RESPONSE:", data);

        if (data.success) {
          showMsg("✅ " + (data.imported || normalized.length) + " questions imported!", "success");
          pendingPreview = [];
          document.getElementById("bulkPreview").classList.remove("show");
          loadQuestions();
        } else {
          showMsg("❌ " + (data.message || "Import failed"), "error");
          console.error("Import failed:", data);
        }
      } catch (e) {
        showMsg("Server error: " + e.message, "error");
        console.error(e);
      }
    });

    document.getElementById("cancelBulkBtn").addEventListener("click", () => {
      pendingPreview = [];
      document.getElementById("bulkPreview").classList.remove("show");
    });

    // ==========================================
    // DELETE
    // ==========================================
    async function delQ(id) {
      if (!confirm("Ye question delete karna hai?")) return;
      try {
        await fetch("/api/questions/" + id, { method: "DELETE", credentials: "include" });
        loadQuestions();
      } catch (e) { showMsg("Delete failed", "error"); }
    }

    // ==========================================
    // HELPERS
    // ==========================================
    function showMsg(text, type) {
      const box = document.getElementById("msg");
      box.textContent = text;
      box.className = "alert " + type;
      box.style.display = "block";
      setTimeout(() => box.style.display = "none", 5000);
    }
    function showBulkMsg(text, type) {
      const box = document.getElementById("bulkMsg");
      box.textContent = text;
      box.className = "alert " + type;
      box.style.display = "block";
    }

    // ==========================================
    // INIT
    // ==========================================
    (async function() {
      const user = await requireLogin();
      if (!user) return;
      if (user.role !== "admin") { location.href = "/dashboard.html"; return; }
      
      // ==========================================
      // TEST SELECTOR (agar testId nahi hai)
      // ==========================================
      if (!testId) {
        document.getElementById("testSelectorBox").style.display = "block";
        document.getElementById("qList").innerHTML = '<div class="empty-box">👆 ऊपर से Test चुनें</div>';
        
        try {
          const r = await fetch("/api/admin/tests", { credentials: "include" });
          const data = await r.json();
          const sel = document.getElementById("testSelector");
          sel.innerHTML = '<option value="">-- Test चुनें --</option>' +
            (data.tests || []).map(t => 
              '<option value="' + t._id + '">' + escapeHtml(t.name || t.test_name || "Untitled") + '</option>'
            ).join("");
          
          sel.addEventListener("change", function() {
            if (this.value) {
              window.location.href = "/admin-questions.html?test=" + this.value;
            }
          });
        } catch (e) {
          console.error("Tests load error:", e);
        }
      }

if (!testId) {
        document.getElementById("qList").innerHTML = '<div class="empty-box">❌ Test ID nahi mila.</div>';
        return;
      }
      await loadTestInfo();
      await loadQuestions();
    })();
  </script>

</body>
</html>
