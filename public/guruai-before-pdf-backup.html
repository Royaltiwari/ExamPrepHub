<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamPrepHub Assistant - GuruAI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#050505;
    color:#fff;
    min-height:100vh;
}

.header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:#0b0b0b;
    border-bottom:1px solid #252525;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logo span{
    color:#00d4ff;
}

.home-btn{
    color:white;
    text-decoration:none;
    border:1px solid #333;
    padding:9px 16px;
    border-radius:8px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 15px;
}

.welcome{
    text-align:center;
    padding:35px 10px 25px;
}

.robot{
    font-size:55px;
}

.welcome h1{
    margin-top:10px;
    font-size:32px;
}

.welcome p{
    margin-top:10px;
    color:#aaa;
}

.chat{
    min-height:400px;
    max-height:600px;
    overflow-y:auto;
    background:#0d0d0d;
    border:1px solid #242424;
    border-radius:18px;
    padding:22px;
}

.message{
    display:flex;
    gap:12px;
    line-height:1.7;
    margin-bottom:22px;
}

.user-message{
    justify-content:flex-end;
}

.user-message .content{
    background:#123746;
    border-radius:14px;
    padding:10px 14px;
    max-width:80%;
}

.ai-message .content{
    max-width:85%;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#181818;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.input-box{
    margin-top:15px;
    display:flex;
    gap:10px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:15px;
    padding:10px;
}

textarea{
    flex:1;
    min-height:50px;
    max-height:160px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
    font-size:16px;
}

.send{
    border:0;
    background:#00a8cc;
    color:white;
    padding:0 22px;
    border-radius:10px;
    cursor:pointer;
    font-size:20px;
}

.send:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.features{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:20px;
}

.feature{
    background:#0d0d0d;
    border:1px solid #242424;
    padding:17px;
    text-align:center;
    border-radius:12px;
    color:#ccc;
}

.typing{
    color:#aaa;
    font-style:italic;
}

.error{
    color:#ff8a8a;
}

@media(max-width:700px){
    .header{padding:0 12px}
    .logo{font-size:16px}
    .welcome h1{font-size:25px}
    .features{grid-template-columns:repeat(2,1fr)}
    .chat{padding:15px}
    .send{padding:0 17px}
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">🏆 ExamPrepHub <span>Assistant</span></div>
    <a href="/index.html" class="home-btn">🏠 Home</a>
</header>

<div class="container">

    <section class="welcome">
        <div class="robot">🤖</div>
        <h1>ExamPrepHub Assistant — GuruAI</h1>
        <p>Ask anything. Learn anything. Prepare smarter.</p>
    </section>

    <section class="chat" id="chatBox">

        <div class="message ai-message">
            <div class="avatar">🤖</div>

            <div class="content">
                <strong>GuruAI</strong>
                <br>
                नमस्ते! 👋 मैं <b>ExamPrepHub Assistant — GuruAI</b> हूँ।
                <br>
                आप अपने exam, questions, notes और study से संबंधित सवाल पूछ सकते हैं।
            </div>
        </div>

    </section>

    <div class="input-box">

        <textarea
            id="userInput"
            placeholder="GuruAI से कुछ पूछें..."
            onkeydown="handleKeyDown(event)"></textarea>

        <button class="send" id="sendButton" onclick="sendMessage()">➤</button>

    </div>

    <div class="features">
        <div class="feature">💬 AI Chat</div>
        <div class="feature">📄 PDF / DOCX</div>
        <div class="feature">🖼️ Image</div>
        <div class="feature">🎬 Cartoon Video</div>
    </div>

</div>

<script>

const input = document.getElementById("userInput");
const chatBox = document.getElementById("chatBox");
const sendButton = document.getElementById("sendButton");

function escapeHtml(text){

    const div = document.createElement("div");
    div.textContent = text;

    return div.innerHTML;
}

function addUserMessage(text){

    const message = document.createElement("div");

    message.className = "message user-message";

    message.innerHTML = `
        <div class="content">
            ${escapeHtml(text)}
        </div>
        <div class="avatar">👤</div>
    `;

    chatBox.appendChild(message);

    scrollChat();
}

function addAIMessage(text){

    const message = document.createElement("div");

    message.className = "message ai-message";

    message.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="content">
            <strong>GuruAI</strong>
            <br>
            ${formatAIText(text)}
        </div>
    `;

    chatBox.appendChild(message);

    scrollChat();
}

function addTyping(){

    const message = document.createElement("div");

    message.id = "typingMessage";
    message.className = "message ai-message";

    message.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="content typing">
            GuruAI सोच रहा है...
        </div>
    `;

    chatBox.appendChild(message);

    scrollChat();
}

function removeTyping(){

    const typing = document.getElementById("typingMessage");

    if(typing){
        typing.remove();
    }
}

function formatAIText(text){

    return escapeHtml(text)
        .replace(/\n/g, "<br>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
}

function scrollChat(){

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    addUserMessage(text);

    input.value = "";

    sendButton.disabled = true;

    addTyping();

    try{

        const response = await fetch("/api/guruai/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:text
            })

        });

        const data = await response.json();

        removeTyping();

        if(!response.ok || !data.success){

            throw new Error(
                data.message || "GuruAI response नहीं मिला।"
            );

        }

        addAIMessage(data.reply);

    }catch(error){

        removeTyping();

        addAIMessage(
            "❌ GuruAI से connection में समस्या हुई।\n\n" +
            error.message
        );

    }finally{

        sendButton.disabled = false;

        input.focus();

    }
}

function handleKeyDown(event){

    if(event.key === "Enter" && !event.shiftKey){

        event.preventDefault();

        sendMessage();

    }
}

input.focus();

</script>

</body>
</html>
