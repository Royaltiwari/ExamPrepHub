<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <a href="/index.html" class="logo">🏆 ExamPrepHub</a>
      <div class="header-actions">
        <a href="/index.html" class="btn-header">← Home</a>
        <a href="/register.html" class="btn-header">Register</a>
      </div>
    </div>
  </header>

  <!-- LOGIN FORM -->
  <div style="min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card" style="max-width: 420px; width: 100%;">

      <!-- BRAND -->
      <div style="text-align: center; margin-bottom: 25px;">
        <div style="font-size: 48px; margin-bottom: 10px;">🏆</div>
        <h1 style="font-size: 26px; font-weight: 900; color: var(--primary); margin-bottom: 6px;">
          ExamPrepHub
        </h1>
        <p class="text-muted" style="font-size: 14px;">
          Login to your learning account
        </p>
      </div>

      <!-- MESSAGE BOX -->
      <div id="message" class="alert" style="display: none;"></div>

      <!-- FORM -->
      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="Enter your email"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>

        <!-- FORGOT PASSWORD LINK -->
        <div style="text-align: right; margin-bottom: 18px;">
          <a href="/forgot-password.html" style="font-size: 13px; color: var(--primary); font-weight: 700;">
            Forgot Password?
          </a>
        </div>

        <button type="submit" class="btn btn-blue btn-block btn-lg" id="loginBtn">
          Login
        </button>

      </form>

      <!-- DIVIDER -->
      <div style="text-align: center; margin: 22px 0; color: var(--muted); font-size: 13px;">
        — Don't have an account? —
      </div>

      <a href="/register.html" class="btn btn-outline btn-block">
        Create Free Account
      </a>

      <!-- BACK TO HOME -->
      <div style="text-align: center; margin-top: 20px;">
        <a href="/index.html" style="font-size: 13px; color: var(--muted);">
          ← Back to Home
        </a>
      </div>

    </div>
  </div>

  <!-- COMMON JS -->
  <script src="/js/common.js"></script>

  <!-- LOGIN LOGIC -->
  <script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const messageEl = document.getElementById("message");

    function showMessage(text, type = "error") {
      messageEl.textContent = text;
      messageEl.className = "alert alert-" + type;
      messageEl.style.display = "flex";
    }

    function hideMessage() {
      messageEl.style.display = "none";
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      hideMessage();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Email aur password required hai", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showMessage(data.message || "Login failed", "error");
          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
          return;
        }

        showMessage("Login successful! Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "/dashboard.html";
        }, 800);

      } catch (error) {
        console.error("Login Error:", error);
        showMessage("Server se connection nahi ho paya. Please try again.", "error");
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
