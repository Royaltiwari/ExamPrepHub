<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow-x: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* =====================================================
       CLEAN DARK BACKGROUND
       ===================================================== */
    body {
      background: #050505;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    /* Subtle gradient overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.15), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.15), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.08), transparent 60%);
      z-index: 0;
      pointer-events: none;
    }

    /* =====================================================
       HEADER
       ===================================================== */
    .login-header {
      position: relative;
      z-index: 10;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      border-bottom: 2px solid rgba(251, 191, 36, 0.3);
    }

    .login-header .logo {
      color: #fbbf24;
      font-size: 18px;
      font-weight: 900;
      text-decoration: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .login-header .header-actions {
      display: flex;
      gap: 10px;
    }

    .login-header .btn-header {
      color: #0f172a;
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    .login-header .btn-header:hover {
      background: #fbbf24;
      color: #000000;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
    }

    /* =====================================================
       MAIN CONTENT
       ===================================================== */
    .login-main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    /* =====================================================
       LOGIN CARD
       ===================================================== */
    .login-card {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid #fbbf24;
      border-radius: 20px;
      padding: 34px 32px;
      width: 100%;
      max-width: 430px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.9),
        0 0 60px rgba(251, 191, 36, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .trophy-icon {
      text-align: center;
      font-size: 54px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.7));
      animation: trophyBounce 3s ease-in-out infinite;
    }

    @keyframes trophyBounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    .login-title {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .login-subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 13.5px;
      margin-bottom: 24px;
      font-weight: 500;
    }

    /* =====================================================
       FORM
       ===================================================== */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      opacity: 0.85;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: rgba(2, 6, 23, 0.8);
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
      font-weight: 500;
    }

    .form-group input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .form-group input:focus {
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
      background: rgba(2, 6, 23, 0.95);
    }

    .show-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: #2563eb;
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .show-btn:hover {
      background: #1d4ed8;
      transform: translateY(-50%) scale(1.05);
    }

    .forgot-link {
      text-align: right;
      margin-bottom: 18px;
    }

    .forgot-link a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .forgot-link a:hover {
      color: #93c5fd;
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.55);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      text-align: center;
      color: #94a3b8;
      font-size: 12.5px;
      margin: 20px 0;
      position: relative;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 35%;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .create-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: transparent;
      color: #f1f5f9;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      transition: all 0.25s ease;
    }

    .create-btn:hover {
      background: rgba(251, 191, 36, 0.1);
      border-color: #fbbf24;
      color: #fbbf24;
    }

    .back-home {
      text-align: center;
      margin-top: 18px;
    }

    .back-home a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-home a:hover {
      color: #fbbf24;
    }

    .status-msg {
      padding: 11px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .status-msg.error {
      background: rgba(220, 38, 38, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, 0.5);
      display: block;
    }

    .status-msg.success {
      background: rgba(16, 185, 129, 0.25);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.5);
      display: block;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */
    @media (max-height: 700px) {
      .login-card { padding: 24px 26px; }
      .trophy-icon { font-size: 42px; margin-bottom: 4px; }
      .login-title { font-size: 23px; }
      .login-subtitle { font-size: 12.5px; margin-bottom: 16px; }
      .form-group { margin-bottom: 12px; }
      .form-group input { padding: 11px 14px 11px 40px; font-size: 13.5px; }
      .login-btn { padding: 12px; font-size: 14px; }
      .create-btn { padding: 12px; font-size: 13.5px; }
      .divider { margin: 14px 0; }
    }

    @media (max-width: 600px) {
      .login-card { padding: 28px 22px; max-width: 100%; }
      .trophy-icon { font-size: 46px; }
      .login-title { font-size: 25px; }
      .login-header { padding: 12px 16px; }
      .login-header .logo { font-size: 15px; }
      .login-header .btn-header { padding: 7px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->
  <header class="login-header">
    <a href="/index.html" class="logo">🏆 ExamPrepHub</a>
    <div class="header-actions">
      <a href="/index.html" class="btn-header">← Home</a>
      <a href="/register.html" class="btn-header">Register</a>
    </div>
  </header>

  <!-- =====================================================
       LOGIN FORM
       ===================================================== -->
  <main class="login-main">
    <div class="login-card">
      <div class="trophy-icon">🏆</div>
      <h1 class="login-title">ExamPrepHub</h1>
      <p class="login-subtitle">Login to your learning account</p>

      <div id="statusMsg" class="status-msg"></div>

      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label>📧 Email Address</label>
          <div class="input-wrap">
            <span class="icon">✉️</span>
            <input type="email" id="email" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group">
          <label>🔒 Password</label>
          <div class="input-wrap">
            <span class="icon">🔑</span>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="show-btn" onclick="togglePassword()" id="showBtn">SHOW</button>
          </div>
        </div>

        <div class="forgot-link">
          <a href="/forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Login</button>

        <div class="divider">— Don't have an account? —</div>

        <a href="/register.html" class="create-btn">Create Free Account</a>

        <div class="back-home">
          <a href="/index.html">← Back to Home</a>
        </div>
      </form>
    </div>
  </main>

  <script>
    function togglePassword() {
      const pwd = document.getElementById("password");
      const btn = document.getElementById("showBtn");
      if (pwd.type === "password") {
        pwd.type = "text";
        btn.textContent = "HIDE";
      } else {
        pwd.type = "password";
        btn.textContent = "SHOW";
      }
    }

    function showMsg(msg, type) {
      const el = document.getElementById("statusMsg");
      el.textContent = msg;
      el.className = "status-msg " + type;
    }

    async function doLogin(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");

      if (!email || !password) {
        showMsg("Please enter email and password", "error");
        return false;
      }

      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          showMsg("✅ Login successful! Redirecting...", "success");
          const user = data.user || {};
          setTimeout(() => {
            if (user.role === "admin") {
              window.location.href = "/admin-dashboard.html";
            } else {
              window.location.href = "/dashboard.html";
            }
          }, 800);
        } else {
          showMsg("❌ " + (data.message || "Invalid credentials"), "error");
          btn.disabled = false;
          btn.textContent = "Login";
        }
      } catch (err) {
        showMsg("❌ " + err.message, "error");
        btn.disabled = false;
        btn.textContent = "Login";
      }

      return false;
    }
  </script>
</body>
</html>
