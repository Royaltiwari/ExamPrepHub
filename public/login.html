<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - ExamPrepHub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef2ff, #dbeafe);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #334155;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .login-btn {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-bottom: 18px;
      padding: 11px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .register-link {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
      font-size: 14px;
    }

    .register-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }

    .home-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #475569;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 28px 20px;
      }

      .logo {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">🏆 ExamPrepHub</div>

    <div class="subtitle">
      Login to your learning account
    </div>

    <div id="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        >
      </div>
      

      <button type="submit" class="login-btn" id="loginBtn">
        Login
      </button>

    </form>

    <div class="register-link">
      Don't have an account?
      <a href="/register.html">Register</a>
    </div>

    <a href="/" class="home-link">
      ← Back to Home
    </a>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.display = "block";

      if (success) {
        message.style.background = "#dcfce7";
        message.style.color = "#166534";
      } else {
        message.style.background = "#fee2e2";
        message.style.color = "#991b1b";
      }
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showMessage(data.message || "Login failed");
          return;
        }

        showMessage("Login successful! Redirecting...", true);

        setTimeout(() => {
          window.location.href = "/dashboard.html";
        }, 800);

      } catch (error) {
        console.error("Login Error:", error);
        showMessage("Server से connection नहीं हो पाया।");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
