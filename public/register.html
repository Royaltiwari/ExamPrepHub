<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register - ExamPrepHub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef2ff, #dbeafe);
      padding: 20px;
    }

    .register-container {
      width: 100%;
      max-width: 440px;
      background: #fff;
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .register-btn:hover {
      background: #1d4ed8;
    }

    .register-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 11px;
      margin-bottom: 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 14px;
    }

    .login-link a,
    .home-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }

    .home-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #475569;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 28px 20px;
      }

      .logo {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="register-container">

    <div class="logo">🏆 ExamPrepHub</div>

    <div class="subtitle">
      Create your free learning account
    </div>

    <div id="message"></div>

    <form id="registerForm">

      <div class="form-group">
        <label for="name">Full Name</label>

        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>

        <input
          type="tel"
          id="mobile"
          placeholder="Enter mobile number"
          maxlength="10"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >
      </div>

      <button
        type="submit"
        class="register-btn"
        id="registerBtn"
      >
        Create Account
      </button>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="/login.html">Login</a>
    </div>

    <a href="/" class="home-link">
      ← Back to Home
    </a>

  </div>

  <script>
    const registerForm = document.getElementById("registerForm");
    const registerBtn = document.getElementById("registerBtn");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.display = "block";

      if (success) {
        message.style.background = "#dcfce7";
        message.style.color = "#166534";
      } else {
        message.style.background = "#fee2e2";
        message.style.color = "#991b1b";
      }
    }

    registerForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const password = document.getElementById("password").value;

      if (password.length < 6) {
        showMessage("Password कम से कम 6 characters का होना चाहिए।");
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = "Creating Account...";

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            name,
            email,
            mobile,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showMessage(data.message || "Registration failed");
          return;
        }

        showMessage(
          "Account created successfully! Redirecting...",
          true
        );

        setTimeout(() => {
          window.location.href = "/dashboard.html";
        }, 800);

      } catch (error) {
        console.error("Register Error:", error);

        showMessage(
          "Server से connection नहीं हो पाया।"
        );

      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
