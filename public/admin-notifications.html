<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Admin</title>
<link rel="stylesheet" href="/css/style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px}
.container{max-width:900px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-head h1{font-size:24px;font-weight:900}
.page-head a{color:var(--primary);text-decoration:none;font-weight:700;font-size:13px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:20px}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:6px;font-weight:800;font-size:12px;color:var(--muted);text-transform:uppercase}
.form-input,.form-select,.form-textarea{width:100%;padding:12px;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
.form-textarea{min-height:100px;resize:vertical}
.btn{padding:12px 20px;border-radius:10px;font-weight:800;font-size:14px;border:none;cursor:pointer;background:var(--gradient-blue);color:white}
.alert{padding:12px;border-radius:10px;margin-bottom:15px;display:none}
.alert.success{background:#14532d;color:#86efac;display:block}
.alert.error{background:#7f1d1d;color:#fca5a5;display:block}
</style>
</head>
<body>
<div class="container">
<div class="page-head"><h1>🔔 Send Notification</h1><a href="/admin-dashboard.html">← Dashboard</a></div>
<div class="card">
<div id="msg" class="alert"></div>
<div class="form-group"><label>Send To</label><select id="sendTo" class="form-select"><option value="all">All Students</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option><option value="competitive">Competitive</option></select></div>
<div class="form-group"><label>Title</label><input type="text" id="title" class="form-input" placeholder="Notification title"></div>
<div class="form-group"><label>Message</label><textarea id="message" class="form-textarea" placeholder="Message..."></textarea></div>
<div class="form-group"><label>Type</label><select id="type" class="form-select"><option value="announcement">📢 Announcement</option><option value="live">🔴 Live Class</option><option value="pdf">📄 New PDF</option><option value="test">📝 New Test</option><option value="result">🏆 Result Ready</option></select></div>
<button class="btn" id="sendBtn">🔔 Send Notification</button>
</div>
</div>
<script src="/js/common.js"></script>
<script>
document.getElementById("sendBtn").addEventListener("click",async()=>{
  const title=document.getElementById("title").value.trim();
  const message=document.getElementById("message").value.trim();
  const sendTo=document.getElementById("sendTo").value;
  const type=document.getElementById("type").value;
  const msgBox=document.getElementById("msg");
  if(!title){msgBox.className="alert error";msgBox.textContent="Title required";return}
  try{
    const r=await fetch("/api/notifications",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({title,message,type,forExams:sendTo==="all"?[]:[sendTo]})});
    const d=await r.json();
    if(d.success){msgBox.className="alert success";msgBox.textContent="✅ Notification sent!";document.getElementById("title").value="";document.getElementById("message").value=""}
    else{msgBox.className="alert error";msgBox.textContent=d.message||"Failed"}
  }catch(e){msgBox.className="alert error";msgBox.textContent="Server error"}
});
(async function(){const u=await requireLogin();if(!u||u.role!=="admin"){location.href="/dashboard.html";return}})();
</script>
</body>
</html>
