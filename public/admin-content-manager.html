<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Manager - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1e1b4b, #312e81); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .header .logo { font-size: 18px; font-weight: 900; }
    .header-actions { display: flex; gap: 8px; }
    .btn-header { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn-header:hover { background: rgba(255,255,255,0.2); }
    .container { max-width: 1200px; margin: auto; padding: 25px 20px; }
    .page-header { margin-bottom: 25px; }
    .page-header h1 { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
    .page-header p { color: var(--muted); font-size: 14px; }
    .filters-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .filter-item { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
    .filter-item label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-item select, .filter-item input { padding: 10px 12px; background: var(--bg); border: 2px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-weight: 600; }
    .filter-item select:focus, .filter-item input:focus { outline: none; border-color: var(--primary); }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-box .num { font-size: 26px; font-weight: 900; color: var(--primary); line-height: 1; }
    .stat-box .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
    .tree-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 15px; }
    .subject-header { background: linear-gradient(135deg, #1e3a8a, #1d4ed8); color: white; padding: 12px 18px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px; user-select: none; margin-bottom: 8px; }
    .subject-header:hover { opacity: 0.9; }
    .subject-header .count { background: rgba(255,255,255,0.25); padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; }
    .chapter-block { margin-left: 15px; border-left: 3px solid var(--primary); padding-left: 15px; margin-bottom: 10px; }
    .chapter-header { background: var(--bg-alt); padding: 10px 14px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; margin-bottom: 8px; user-select: none; }
    .chapter-header:hover { background: var(--card-hover); }
    .chapter-header .count { color: var(--muted); font-size: 11px; }
    .item-list { display: flex; flex-direction: column; gap: 6px; }
    .item-row { background: var(--bg); padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; border: 1px solid var(--border); }
    .item-row:hover { border-color: var(--primary); }
    .item-row .info { flex: 1; min-width: 0; }
    .item-row .title { font-weight: 700; margin-bottom: 4px; }
    .item-row .meta { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; display: inline-block; }
    .badge-live { background: #dc2626; color: white; }
    .badge-recorded { background: #16a34a; color: white; }
    .badge-scheduled { background: #f59e0b; color: white; }
    .badge-paid { background: #78350f; color: #fcd34d; }
    .badge-free { background: #14532d; color: #86efac; }
    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); background: var(--card-bg); border: 1px dashed var(--border); border-radius: 14px; font-size: 14px; }
    .loading-box { text-align: center; padding: 40px; color: var(--muted); }
    .hidden { display: none; }
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .filters-bar { flex-direction: column; }
      .filter-item { min-width: 100%; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">🎯 Content Manager</div>
  <div class="header-actions">
    <a href="/admin.html" class="btn-header">← Admin Home</a>
    <button class="btn-header" onclick="location.reload()">🔄 Refresh</button>
  </div>
</div>

<div class="container">

  <div class="page-header">
    <h1>🎯 Content Manager</h1>
    <p>Exam → Subject → Chapter ke hisaab se saara content ek jagah</p>
  </div>

  <div class="filters-bar">
    <div class="filter-item">
      <label>Select Exam</label>
      <select id="examSelect">
        <option value="">-- Loading exams --</option>
      </select>
    </div>
    <div class="filter-item">
      <label>Search Class Title</label>
      <input type="text" id="searchInput" placeholder="Class title search..." />
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-box"><div class="num" id="statSubjects">0</div><div class="lbl">Subjects</div></div>
    <div class="stat-box"><div class="num" id="statChapters">0</div><div class="lbl">Chapters</div></div>
    <div class="stat-box"><div class="num" id="statClasses">0</div><div class="lbl">Classes</div></div>
    <div class="stat-box"><div class="num" id="statLive">0</div><div class="lbl">Live Now</div></div>
  </div>

  <div id="mainContent">
    <div class="empty-state">👆 Upar se ek exam select karo</div>
  </div>

</div>

<script src="/js/common.js"></script>
<script>
  let allExams = [];
  let currentTree = {};
  let searchQuery = "";

  async function loadExams() {
    try {
      const r = await fetch("/api/exam-links", { credentials: "include" });
      const data = await r.json();
      const linkExams = (data.data || []).map(e => e.examName);

      const extraExams = ["SSC GD","SSC CGL","SSC CHSL","SSC MTS","Railway","BSF HCM","CRPF","CISF","ITBP","UPSSSC PET","UP Police","Agniveer"];

      const combined = [...new Set([...linkExams, ...extraExams])];

      const sel = document.getElementById("examSelect");
      sel.innerHTML = '<option value="">-- Select Exam --</option>' +
        combined.map(e => '<option value="' + escapeHtml(e) + '">' + escapeHtml(e) + '</option>').join("");
    } catch (e) {
      console.error("Load exams error:", e);
    }
  }

  async function loadTree(examName) {
    const box = document.getElementById("mainContent");
    box.innerHTML = '<div class="loading-box">Loading content tree...</div>';

    try {
      const r = await fetch("/api/classes/grouped/" + encodeURIComponent(examName), { credentials: "include" });
      const data = await r.json();

      if (!data.success) throw new Error(data.message || "Failed");

      currentTree = data.data || {};
      renderTree();
    } catch (e) {
      box.innerHTML = '<div class="empty-state">❌ ' + escapeHtml(e.message) + '</div>';
    }
  }

  function renderTree() {
    const box = document.getElementById("mainContent");
    const subjectKeys = Object.keys(currentTree);

    if (!subjectKeys.length) {
      box.innerHTML = '<div class="empty-state">📭 Is exam me abhi koi class nahi hai. Admin panel se class add karo.</div>';
      updateStats(0, 0, 0, 0);
      return;
    }

    let totalChapters = 0;
    let totalClasses = 0;
    let totalLive = 0;
    let html = '';

    subjectKeys.forEach(subject => {
      const chapters = currentTree[subject];
      const chapterKeys = Object.keys(chapters);

      let subjectClassCount = 0;
      chapterKeys.forEach(ch => { subjectClassCount += chapters[ch].length; });

      totalChapters += chapterKeys.length;
      totalClasses += subjectClassCount;

      html += '<div class="tree-section">';
      html += '<div class="subject-header" onclick="toggleNext(this)">' +
        '<span>📚 ' + escapeHtml(subject) + '</span>' +
        '<span class="count">' + subjectClassCount + ' classes</span>' +
      '</div>';
      html += '<div>';

      chapterKeys.forEach(chapter => {
        const items = chapters[chapter];
        const chapterDisplay = chapter || "General";
        const filtered = searchQuery
          ? items.filter(it => (it.title || "").toLowerCase().includes(searchQuery.toLowerCase()))
          : items;

        if (searchQuery && filtered.length === 0) return;

        html += '<div class="chapter-block">';
        html += '<div class="chapter-header" onclick="toggleNext(this)">' +
          '<span>📖 ' + escapeHtml(chapterDisplay) + '</span>' +
          '<span class="count">' + filtered.length + ' items</span>' +
        '</div>';
        html += '<div class="item-list">';

        filtered.forEach(it => {
          const statusClass = it.status === "live" ? "badge-live" : it.status === "scheduled" ? "badge-scheduled" : "badge-recorded";
          const statusText = it.status === "live" ? "🔴 LIVE" : it.status === "scheduled" ? "📅 Scheduled" : "📹 Recorded";
          const paidBadge = it.isPaid
            ? '<span class="badge badge-paid">💰 ₹' + (it.price || 0) + '</span>'
            : '<span class="badge badge-free">🆓 Free</span>';

          if (it.status === "live") totalLive++;

          html += '<div class="item-row">' +
            '<div class="info">' +
              '<div class="title">' + escapeHtml(it.title || "Untitled") + '</div>' +
              '<div class="meta">' +
                '<span class="badge ' + statusClass + '">' + statusText + '</span>' +
                paidBadge +
                (it.duration ? '<span>⏱️ ' + it.duration + ' min</span>' : '') +
                (it.teacher ? '<span>👨‍🏫 ' + escapeHtml(it.teacher) + '</span>' : '') +
              '</div>' +
            '</div>' +
            '<a href="/class-detail.html?id=' + it._id + '" class="btn-header" style="padding: 6px 12px; font-size: 11px;">👁 View</a>' +
          '</div>';
        });

        html += '</div></div>';
      });

      html += '</div></div>';
    });

    box.innerHTML = html;
    updateStats(subjectKeys.length, totalChapters, totalClasses, totalLive);
  }

  function updateStats(subjects, chapters, classes, live) {
    document.getElementById("statSubjects").textContent = subjects;
    document.getElementById("statChapters").textContent = chapters;
    document.getElementById("statClasses").textContent = classes;
    document.getElementById("statLive").textContent = live;
  }

  function toggleNext(el) {
    const body = el.nextElementSibling;
    if (body) body.classList.toggle("hidden");
  }

  document.getElementById("examSelect").addEventListener("change", (e) => {
    const exam = e.target.value;
    if (!exam) {
      document.getElementById("mainContent").innerHTML = '<div class="empty-state">👆 Upar se ek exam select karo</div>';
      updateStats(0, 0, 0, 0);
      return;
    }
    loadTree(exam);
  });

  document.getElementById("searchInput").addEventListener("input", debounce((e) => {
    searchQuery = e.target.value.trim();
    if (Object.keys(currentTree).length) renderTree();
  }, 300));

  (async function() {
    const user = await requireLogin();
    if (!user) return;
    if (user.role !== "admin") {
      window.location.href = "/dashboard.html";
      return;
    }
    loadExams();
  })();
</script>

</body>
</html>
