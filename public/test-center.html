<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
    .top-bar { background: linear-gradient(135deg, #1e1b4b, #312e81); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .back-btn { background: rgba(255,255,255,0.1); border: none; width: 38px; height: 38px; border-radius: 10px; color: white; cursor: pointer; font-size: 18px; }
    .title-bar { color: white; font-size: 16px; font-weight: 900; flex: 1; text-align: center; }
    .container { max-width: 900px; margin: auto; padding: 20px; }

    .page-header { text-align: center; margin-bottom: 25px; }
    .page-header h1 { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
    .page-header p { color: var(--muted); font-size: 14px; }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 6px; }
    .f-tab { background: var(--card-bg); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; color: var(--text-light); }
    .f-tab.active { background: var(--gradient-blue); color: white; border-color: transparent; }

    .test-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .test-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: all 0.2s; cursor: pointer; }
    .test-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 8px 25px rgba(59,130,246,0.3); }

    .test-head { padding: 16px 16px 12px; }
    .test-badges { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; }
    .badge-exam { background: #1e3a8a; color: #93c5fd; }
    .badge-free { background: #14532d; color: #86efac; }
    .badge-paid { background: #78350f; color: #fcd34d; }

    .test-head h3 { font-size: 15px; margin-bottom: 8px; line-height: 1.3; }
    .test-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--muted); }
    .test-meta span { display: flex; align-items: center; gap: 3px; }

    .test-footer { padding: 12px 16px; background: var(--bg-alt); display: flex; gap: 8px; }
    .btn-start { flex: 1; background: var(--gradient-blue); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; text-decoration: none; text-align: center; display: inline-block; }
    .btn-unlock { flex: 1; background: var(--gradient-red); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; text-align: center; display: inline-block; text-decoration: none; }

    .empty-box { text-align: center; padding: 50px 20px; color: var(--muted); background: var(--card-bg); border: 1px dashed var(--border); border-radius: 14px; font-size: 14px; grid-column: 1/-1; }
    .loading-box { text-align: center; padding: 40px; color: var(--muted); grid-column: 1/-1; }

    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); padding: 8px 0; z-index: 99; }
    .bottom-nav-inner { display: flex; justify-content: space-around; max-width: 500px; margin: auto; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 700; padding: 4px 12px; }
    .bottom-nav a .ic { font-size: 20px; }
    .bottom-nav a.active { color: var(--primary); }

    @media (max-width: 700px) { .test-grid { grid-template-columns: 1fr; } .bottom-nav { display: block; } .container { padding: 15px; } }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="location.href='/dashboard.html'">←</button>
  <div class="title-bar">📝 Test Center</div>
  <button class="back-btn" onclick="location.href='/dashboard.html'">🏠</button>
</div>

<div class="container">

  <div class="page-header">
    <h1>📝 My Tests</h1>
    <p>Practice tests aur mock exams</p>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <div class="f-tab active" data-filter="all">All</div>
    <div class="f-tab" data-filter="free">🆓 Free</div>
    <div class="f-tab" data-filter="paid">💰 Paid</div>
    <div class="f-tab" data-filter="completed">✅ Completed</div>
  </div>

  <div class="test-grid" id="testGrid">
    <div class="loading-box">Loading tests...</div>
  </div>

</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/dashboard.html"><span class="ic">🏠</span> Home</a>
    <a href="/home-class.html"><span class="ic">📚</span> Learn</a>
    <a href="/test-center.html" class="active"><span class="ic">📝</span> Tests</a>
    <a href="/progress.html"><span class="ic">📊</span> Progress</a>
    <a href="/profile.html"><span class="ic">👤</span> Profile</a>
  </div>
</nav>

<script src="/js/common.js"></script>
<script>
  let allTests = [];
  let currentFilter = "all";
  let completedTestIds = [];

  async function loadTests() {
    const grid = document.getElementById("testGrid");
    try {
      const r = await fetch("/api/tests", { credentials: "include" });
      const data = await r.json();
      allTests = data.tests || [];

      // Load completed tests
      try {
        const pr = await fetch("/api/progress/my", { credentials: "include" });
        const pd = await pr.json();
        if (pd.success) {
          completedTestIds = pd.data
            .filter(p => p.type === "test" && p.completed)
            .map(p => String(p.testId));
        }
      } catch (e) {}

      renderTests();
    } catch (e) {
      grid.innerHTML = '<div class="empty-box">❌ Tests load nahi ho paye</div>';
    }
  }

  function renderTests() {
    const grid = document.getElementById("testGrid");
    let filtered = allTests;

    if (currentFilter === "free") {
      filtered = allTests.filter(t => !t.isPaid);
    } else if (currentFilter === "paid") {
      filtered = allTests.filter(t => t.isPaid);
    } else if (currentFilter === "completed") {
      filtered = allTests.filter(t => completedTestIds.includes(String(t._id)));
    }

    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-box">Koi test available nahi hai is category me.</div>';
      return;
    }

    grid.innerHTML = filtered.map(t => {
      const isCompleted = completedTestIds.includes(String(t._id));
      const badgeClass = t.isPaid ? "badge-paid" : "badge-free";
      const badgeText = t.isPaid ? "💰 ₹" + (t.price || 0) : "🆓 Free";

      return '<div class="test-card">' +
        '<div class="test-head">' +
          '<div class="test-badges">' +
            '<span class="badge badge-exam">' + escapeHtml(t.exam || "Exam") + '</span>' +
            '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
          '</div>' +
          '<h3>' + escapeHtml(t.name || "Mock Test") + '</h3>' +
          '<div class="test-meta">' +
            '<span>❓ ' + (t.totalQuestions || 0) + ' Q</span>' +
            '<span>⏱️ ' + (t.duration || 0) + ' min</span>' +
            (isCompleted ? '<span style="color: #22c55e;">✅ Completed</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="test-footer">' +
          (isCompleted
            ? '<a href="/result.html?test=' + t._id + '" class="btn-start" style="background: var(--gradient-green);">📊 View Result</a>'
            : (t.isPaid
                ? '<a href="/payment.html?type=test&id=' + t._id + '&title=' + encodeURIComponent(t.name || "") + '&price=' + (t.price || 0) + '" class="btn-unlock">🔒 Unlock ₹' + (t.price || 0) + '</a>'
                : '<a href="/test-attempt.html?id=' + t._id + '" class="btn-start">▶ Start Test</a>'
              )
          ) +
        '</div>' +
      '</div>';
    }).join("");
  }

  document.querySelectorAll(".f-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".f-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentFilter = tab.dataset.filter;
      renderTests();
    });
  });

  (async function() {
    const user = await requireLogin();
    if (!user) return;
    loadTests();
  })();
</script>
</body>
</html>
