<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Class - ExamPrepHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
    }

    /* TOP BAR */
    .top-bar {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .top-bar .logo { font-size: 18px; font-weight: 900; color: white; }
    .top-bar .back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      width: 38px; height: 38px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .top-bar .back-btn:hover { background: rgba(255,255,255,0.2); }

    /* CONTAINER */
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px;
    }

    /* PAGE HEADER */
    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .page-header h1 {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .page-header p {
      color: var(--muted);
      font-size: 14px;
    }

    /* SECTION */
    .section {
      margin-bottom: 35px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* GRID */
    .class-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* CARD */
    .class-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
    }
    .class-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
    }
    .class-card .emoji {
      font-size: 36px;
    }
    .class-card .name {
      font-size: 14px;
      font-weight: 800;
    }
    .class-card .sub {
      font-size: 11px;
      color: var(--muted);
    }

    /* COMPETITIVE GRID */
    .comp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 8px 0;
      z-index: 99;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
    }
    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
      max-width: 500px;
      margin: auto;
    }
    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 8px;
    }
    .bottom-nav a .ic { font-size: 20px; }
    .bottom-nav a.active { color: var(--primary); }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .class-grid { grid-template-columns: repeat(3, 1fr); }
      .comp-grid { grid-template-columns: repeat(2, 1fr); }
      .bottom-nav { display: block; }
    }
    @media (max-width: 600px) {
      .class-grid { grid-template-columns: repeat(2, 1fr); }
      .container { padding: 18px 14px; }
      .page-header h1 { font-size: 22px; }
    }
    @media (max-width: 400px) {
      .class-grid { grid-template-columns: 1fr 1fr; }
      .class-card { padding: 14px 8px; }
      .class-card .emoji { font-size: 28px; }
      .class-card .name { font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='/dashboard.html'">←</button>
    <div class="logo">🏠 Home Class</div>
    <button class="back-btn" onclick="location.href='/dashboard.html'">🏠</button>
  </div>

  <div class="container">

    <div class="page-header">
      <h1>🏠 Home Class</h1>
      <p>What do you want to learn?</p>
    </div>

    <!-- SCHOOL CLASSES -->
    <div class="section">
      <div class="section-title">
        🎓 SCHOOL CLASSES
      </div>
      <div class="class-grid" id="schoolGrid"></div>
    </div>

    <!-- COMPETITIVE EXAMS -->
    <div class="section">
      <div class="section-title">
        🏆 COMPETITIVE EXAMS
      </div>
      <div class="comp-grid" id="compGrid"></div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="/dashboard.html">
        <span class="ic">🏠</span> Home
      </a>
      <a href="/home-class.html" class="active">
        <span class="ic">📚</span> Learn
      </a>
      <a href="/test-center.html">
        <span class="ic">📝</span> Tests
      </a>
      <a href="/progress.html">
        <span class="ic">📊</span> Progress
      </a>
      <a href="/profile.html">
        <span class="ic">👤</span> Profile
      </a>
    </div>
  </nav>

  <script src="/js/common.js"></script>
  <script>
    // School classes
    const schoolClasses = [
      { name: "Class 6", icon: "📗", category: "Class 6" },
      { name: "Class 7", icon: "📘", category: "Class 7" },
      { name: "Class 8", icon: "📙", category: "Class 8" },
      { name: "Class 9", icon: "📕", category: "Class 9" },
      { name: "Class 10", icon: "📓", category: "Class 10" },
      { name: "Class 11", icon: "📔", category: "Class 11" },
      { name: "Class 12", icon: "📒", category: "Class 12" }
    ];

    // Competitive exams
    const competitiveExams = [
      { name: "SSC GD", icon: "🪖", exam: "SSC GD" },
      { name: "SSC CGL", icon: "📘", exam: "SSC CGL" },
      { name: "SSC CHSL", icon: "📖", exam: "SSC CHSL" },
      { name: "SSC MTS", icon: "📝", exam: "SSC MTS" },
      { name: "Railway", icon: "🚆", exam: "Railway" },
      { name: "BSF HCM", icon: "🛡️", exam: "BSF HCM" },
      { name: "CRPF", icon: "🛡️", exam: "CRPF" },
      { name: "CISF", icon: "🛡️", exam: "CISF" },
      { name: "ITBP", icon: "🛡️", exam: "ITBP" },
      { name: "UPSSSC PET", icon: "🏛️", exam: "UPSSSC PET" },
      { name: "UP Police", icon: "👮", exam: "UP Police" },
      { name: "Agniveer", icon: "🎖️", exam: "Agniveer" }
    ];

    // Render school
    const schoolGrid = document.getElementById("schoolGrid");
    schoolGrid.innerHTML = schoolClasses.map(c => `
      <a href="/exam-detail.html?category=${encodeURIComponent(c.category)}" class="class-card">
        <div class="emoji">${c.icon}</div>
        <div class="name">${c.name}</div>
      </a>
    `).join("");

    // Render competitive
    const compGrid = document.getElementById("compGrid");
    compGrid.innerHTML = competitiveExams.map(e => `
      <a href="/exam-detail.html?exam=${encodeURIComponent(e.exam)}" class="class-card">
        <div class="emoji">${e.icon}</div>
        <div class="name">${e.name}</div>
      </a>
    `).join("");

    // Auth check
    (async function() {
      const user = await requireLogin();
      if (!user) return;
    })();
  </script>

</body>
</html>
